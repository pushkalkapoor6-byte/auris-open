<!DOCTYPE html>
<html lang="en-GB">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auris Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#17231c; --muted:#5d6b62; --line:#dde3dc;
  --pri:#1d6b45; --pri-ink:#ffffff; --pri-soft:#e4f1ea; --ball:#d6e43a;
  --ok:#1d7a46; --ok-soft:#e1f3e8; --warn:#9a6400; --warn-soft:#fff3d6; --bad:#b3261e; --bad-soft:#fbe4e2;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--pri)}
header{background:var(--pri);color:#fff;padding:14px 16px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{margin:0;font-size:20px;letter-spacing:.2px}
.brand small{display:block;opacity:.85;font-size:12.5px;font-weight:400}
.ball{width:26px;height:26px;border-radius:50%;background:var(--ball);flex:none;position:relative;overflow:hidden}
.ball:before,.ball:after{content:"";position:absolute;width:26px;height:26px;border:2px solid #fff;border-radius:50%;top:0}
.ball:before{left:-15px}.ball:after{right:-15px}
.who{font-size:12px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#fff;opacity:.8;padding:10px 12px;font:inherit;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{opacity:1;border-bottom-color:var(--ball);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15.5px;margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:#efc3bf}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:#eef1ed;color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.pri{background:var(--pri-soft);color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.list .item{border-bottom:1px solid var(--line);padding:12px 0}
.list .item:last-child{border-bottom:0}
.mrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .t{font-weight:700;font-variant-numeric:tabular-nums}
.mrow .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.vs{font-size:14px}
.vs .w{font-weight:700}
.vs .meta{font-size:12px;color:var(--muted)}
.score{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;min-width:190px;gap:10px}
.bcol h4{margin:0 0 4px;font-size:12.5px;color:var(--muted);text-align:center}
.bm{border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;overflow:hidden}
.bm div{padding:6px 9px;display:flex;justify-content:space-between;gap:6px}
.bm div+div{border-top:1px solid var(--line)}
.bm .w{font-weight:700;background:var(--pri-soft)}
.bm .s{font-size:11.5px;color:var(--muted);padding:3px 9px;background:#fafbfa;justify-content:space-between}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border:1px dashed var(--line);border-radius:10px}
.pay{background:var(--pri-soft);border-radius:10px;padding:12px}
.cat-pick{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cat-pick.on{border-color:var(--pri);background:#f7fbf8}
.cat-pick .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cat-pick input[type=checkbox]{width:20px;height:20px;margin:0 8px 0 0;vertical-align:middle}
.radio{display:flex;gap:8px}
.radio label{flex:1;margin:0;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px}
.radio input{width:auto}
.radio label.on{border-color:var(--pri);background:var(--pri-soft);font-weight:600}
.winpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.winpick button{padding:14px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.winpick button.on{border-color:var(--pri);background:var(--pri-soft)}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 24px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;line-height:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17231c;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;display:none}
#toast.bad{background:var(--bad)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:#5c3c00;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.okbox{background:var(--ok-soft);color:#0f4a2a;border-radius:10px;padding:12px;font-size:14px;margin:10px 0}
.rules{white-space:pre-line}
.inline-input{width:70px;padding:6px 8px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:20px 0 30px}
.hwrap{max-width:1200px;margin:0 auto}
.bround{display:flex;flex-direction:column;min-width:190px}
.bround h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);text-align:center}
.bround .bcol{flex:1;min-width:0}
/* tablet & laptop */
@media(min-width:900px){
  header{padding:16px 24px 0}
  main{max-width:1200px;padding:24px}
  .card{padding:20px 22px}
  .list.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
  .list.cols>.item,.list.cols>.mrow,.list.cols>div{border-bottom:1px solid var(--line)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .sheet{max-width:640px}
  .bround{min-width:220px}
}
@media(min-width:1400px){.list.cols{grid-template-columns:1fr 1fr 1fr}}
@media(hover:hover){.btn:hover{filter:brightness(.97)}.chip:hover{border-color:var(--pri)}nav button:hover{opacity:1}}
#print{display:none}
@media print{
  header,main,#toast,.modal,.foot{display:none!important}
  body{background:#fff}
  #print{display:block;font-size:12px;color:#000}
  .pc{border:1.5px solid #000;padding:10px 12px;height:135mm;page-break-inside:avoid;margin-bottom:6mm;position:relative}
  .pc:nth-child(2n){page-break-after:always}
  .pc table td,.pc table th{border:1px solid #000;padding:6px;height:30px}
  .pp table td,.pp table th{border:1px solid #888;padding:5px}
  .pb{page-break-after:always}
}
.pc h4{margin:0;font-size:16px}
.pc .hd{display:flex;justify-content:space-between;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:8px}
.pc .sig{display:flex;justify-content:space-between;margin-top:14px;gap:20px}
.pc .sig div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:11px}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <div class="brand">
    <div class="row" style="gap:10px;flex-wrap:nowrap">
      <div class="ball"></div>
      <h1 id="tName">Auris Open<small id="tTag">Auris Serenity Towers 1, 2 &amp; 3</small></h1>
    </div>
    <span class="who" id="who" style="display:none"></span>
  </div>
  <nav id="nav"></nav>
 </div>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<div class="foot" id="foot"></div>
<div id="print"></div>
<div id="toast"></div>

<script>
/* ===================== STATE & API ===================== */
var S = { view:'home', token:'', me:null, pub:null, adm:null, sc:null, f:{} };
try { var saved = JSON.parse(sessionStorage.getItem('auris_sess') || 'null'); if (saved) { S.token = saved.token; S.me = saved.me; } } catch (e) {}

function call(action, payload) {
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (s) { var r = JSON.parse(s); if (r.ok) res(r.data); else rej(new Error(r.error)); })
      .withFailureHandler(function (e) { rej(e instanceof Error ? e : new Error(String(e && e.message || e))); })
      .api(action, JSON.stringify(payload || {}), S.token || '');
  });
}
function saveSess() { try { sessionStorage.setItem('auris_sess', JSON.stringify(S.token ? { token: S.token, me: S.me } : null)); } catch (e) {} }

/* ===================== UTILITIES ===================== */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function $(id) { return document.getElementById(id); }
function val(id) { var el = $(id); return el ? el.value.trim() : ''; }
function toast(msg, bad) { var t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, bad ? 5000 : 2800); }
function fail(e) { toast(e.message || String(e), true); }
function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn._t = btn.innerHTML; btn.innerHTML = 'Please wait…'; } else if (btn._t) btn.innerHTML = btn._t; }
function dayLabel(d) { if (!d) return 'Not scheduled'; var x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); }
function shortDay(d) { if (!d) return ''; var x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function role() { return S.me ? S.me.role : ''; }
function isStaff() { return role() === 'Admin' || role() === 'Organiser'; }
function modal(html) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="sheet"><button class="x" onclick="closeModal()" aria-label="Close">×</button>' + html + '</div>'; m.addEventListener('click', function (e) { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal() { document.querySelectorAll('.modal').forEach(function (m) { m.remove(); }); }

/* data source for the current viewer */
function D() { return isStaff() ? S.adm : role() === 'Scorer' ? S.sc : S.pub; }
function catMap() { var m = {}; (D().categories || []).forEach(function (c) { m[c.CategoryID] = c; }); return m; }
function entMap() {
  var m = {}; var d = D();
  (d.entries || []).forEach(function (e) {
    if (e.EntryID) m[e.EntryID] = { id: e.EntryID, name: e.Player2 ? e.Player1 + ' / ' + e.Player2 : e.Player1, tower: [e.P1Tower, e.Player2 && e.P2Tower !== e.P1Tower ? e.P2Tower : ''].filter(Boolean).join(' / '), raw: e };
    else m[e.id] = e;
  });
  return m;
}
function feederMap() { var f = {}; (D().matches || []).forEach(function (m) { if (m.NextMatch) f[m.NextMatch + m.NextSlot] = m; }); return f; }
function sideName(m, slot, E, F) {
  var id = slot === 'A' ? m.SideA : m.SideB;
  if (id === 'BYE') return 'Bye';
  if (id && E[id]) return E[id].name;
  var fd = F && F[m.MatchID + slot];
  return fd ? 'Winner of M' + fd.MatchNo : 'TBD';
}
function sideTower(m, slot, E) { var id = slot === 'A' ? m.SideA : m.SideB; return id && E[id] ? E[id].tower : ''; }
function sortMatches(ms) {
  return ms.slice().sort(function (a, b) {
    var ka = (a.Date || '9999') + ' ' + (a.Time || '99:99') + ' ' + (a.Court || ''), kb = (b.Date || '9999') + ' ' + (b.Time || '99:99') + ' ' + (b.Court || '');
    return ka < kb ? -1 : ka > kb ? 1 : (a.CategoryID < b.CategoryID ? -1 : a.CategoryID > b.CategoryID ? 1 : Number(a.MatchNo) - Number(b.MatchNo));
  });
}
function resultBadge(m) {
  if (m.Result === 'Completed') return '<span class="badge ok">Done</span>';
  if (m.Result === 'Walkover') return '<span class="badge warn">W/O</span>';
  if (m.Result === 'Retired') return '<span class="badge warn">Ret.</span>';
  if (m.Result === 'Bye') return '<span class="badge">Bye</span>';
  return '';
}
function parseGames(score) {
  var s = String(score || '').replace(/\(\d+\)/g, ''); var re = /(\d+)\s*[-–]\s*(\d+)/g, r, w = 0, l = 0;
  while ((r = re.exec(s))) { w += +r[1]; l += +r[2]; }
  return { w: w, l: l };
}

/* ===================== NAVIGATION ===================== */
var NAVS = {
  Public: [['home', 'Home'], ['register', 'Register'], ['draws', 'Draws'], ['schedule', 'Matches & Results'], ['mine', 'My Entries'], ['login', 'Staff login']],
  Scorer: [['scores', 'Enter Scores'], ['draws', 'Draws'], ['schedule', 'Matches'], ['print', 'Print'], ['logout', 'Log out']],
  Organiser: [['dash', 'Dashboard'], ['entries', 'Entries'], ['cats', 'Categories'], ['drawadmin', 'Draws'], ['sched', 'Schedule'], ['scores', 'Scores'], ['accounts', 'Accounts'], ['print', 'Print'], ['export', 'Export'], ['logout', 'Log out']],
  Admin: [['dash', 'Dashboard'], ['entries', 'Entries'], ['cats', 'Categories'], ['drawadmin', 'Draws'], ['sched', 'Schedule'], ['scores', 'Scores'], ['accounts', 'Accounts'], ['print', 'Print'], ['export', 'Export'], ['settings', 'Settings'], ['users', 'Users'], ['logout', 'Log out']]
};
function renderNav() {
  var items = NAVS[role() || 'Public'];
  $('nav').innerHTML = items.map(function (i) { return '<button class="' + (S.view === i[0] ? 'on' : '') + '" onclick="go(\'' + i[0] + '\')">' + i[1] + '</button>'; }).join('');
  var on = document.querySelector('nav button.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  var w = $('who');
  if (S.me) { w.style.display = ''; w.textContent = S.me.name + ' · ' + S.me.role; } else w.style.display = 'none';
}
function go(v) {
  if (v === 'logout') { S.token = ''; S.me = null; S.adm = null; S.sc = null; saveSess(); S.view = 'home'; return boot(); }
  S.view = v; renderNav(); render(); window.scrollTo(0, 0);
}
function render() {
  var fn = VIEWS[S.view] || VIEWS.home;
  try { $('app').innerHTML = fn(); if (fn.after) fn.after(); } catch (e) { $('app').innerHTML = '<div class="card">Something went wrong: ' + esc(e.message) + '</div>'; console.error(e); }
}
function boot() {
  $('app').innerHTML = '<div class="loading">Loading…</div>';
  var p;
  if (isStaff()) p = call('getAdmin').then(function (d) { S.adm = d; });
  else if (role() === 'Scorer') p = call('getScorer').then(function (d) { S.sc = d; });
  else p = call('getPublic').then(function (d) { S.pub = d; });
  return p.then(function () {
    var st = D().settings || {};
    $('tName').innerHTML = esc(st.TournamentName || 'Auris Open') + '<small>' + esc(st.Tagline || '') + '</small>';
    document.title = st.TournamentName || 'Auris Open';
    $('foot').textContent = (st.Venue || '') + (st.ContactName ? ' · Contact: ' + st.ContactName + ' ' + (st.ContactPhone || '') : '');
    if (S.me && NAVS[role()].map(function (x) { return x[0]; }).indexOf(S.view) < 0) S.view = NAVS[role()][0][0];
    renderNav(); render();
  }).catch(function (e) {
    if (/Session expired/.test(e.message)) { S.token = ''; S.me = null; saveSess(); return boot(); }
    $('app').innerHTML = '<div class="card">Could not load: ' + esc(e.message) + '</div>';
  });
}
function reload() { return boot(); }

/* ===================== VIEWS ===================== */
var VIEWS = {};

/* ---------- HOME ---------- */
VIEWS.home = function () {
  var d = S.pub, s = d.settings;
  var cats = d.categories.slice().sort(function (a, b) { return a.Order - b.Order; });
  return '<div class="card"><h2>' + esc(s.TournamentName) + '</h2><p>' + esc(s.About) + '</p>' +
    '<div class="grid2"><div><span class="muted small">Dates</span><br><b>' + esc(s.Dates) + '</b></div><div><span class="muted small">Venue</span><br><b>' + esc(s.Venue) + '</b></div></div>' +
    '<div class="row" style="margin-top:14px">' + (s.RegistrationOpen ? '<button class="btn pri" onclick="go(\'register\')">Register now</button>' : '<span class="badge bad">Registrations closed</span>') +
    '<button class="btn" onclick="go(\'draws\')">View draws</button><button class="btn" onclick="go(\'mine\')">My entries</button></div></div>' +
    '<div class="card"><h2>Categories</h2><div class="tablewrap"><table><tr><th>Category</th><th>Format</th><th class="num">Fee</th><th class="num">Entries</th><th></th></tr>' +
    cats.map(function (c) {
      return '<tr><td><b>' + esc(c.Name) + '</b><br><span class="muted small">' + esc(c.Type) + (c.Notes ? ' · ' + esc(c.Notes) : '') + '</span></td><td>' + esc(c.Format) + '</td><td class="num">' + money(c.Fee) +
        '</td><td class="num">' + c.Entries + (c.MaxEntries ? '/' + c.MaxEntries : '') + '</td><td>' + (c.Status === 'Open' ? '<span class="badge ok">Open</span>' : '<span class="badge">Closed</span>') + '</td></tr>';
    }).join('') + '</table></div></div>' +
    (s.Rules ? '<div class="card"><h2>Rules</h2><div class="rules small">' + esc(s.Rules) + '</div></div>' : '');
};

/* ---------- REGISTER (also used by admin "add entry") ---------- */
S.reg = { cats: {}, mode: 'UPI', shot: null };
function regForm(adminMode) {
  var d = D(), s = d.settings;
  var cats = d.categories.filter(function (c) { return adminMode || c.Status === 'Open'; }).sort(function (a, b) { return a.Order - b.Order; });
  var towers = ['Tower 1', 'Tower 2', 'Tower 3', 'Guest'];
  var tSel = function (id) { return '<select id="' + id + '"><option value="">Select</option>' + towers.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select>'; };
  return '<h3>Your details</h3><div class="grid2"><div><label>Full name *</label><input id="r_name" autocomplete="name"></div>' +
    '<div><label>Mobile number *</label><input id="r_phone" inputmode="tel" placeholder="10-digit mobile"></div>' +
    '<div><label>Tower *</label>' + tSel('r_tower') + '</div><div><label>Flat no.</label><input id="r_flat"></div></div>' +
    '<h3>Categories</h3><p class="muted small">You can enter up to ' + (s.MaxCategoriesPerPlayer || '') + ' categories.</p>' +
    cats.map(function (c) {
      return '<div class="cat-pick" id="cp_' + c.CategoryID + '"><div class="top"><label style="margin:0;color:var(--ink);font-size:15px;display:flex;align-items:center"><input type="checkbox" onchange="regPick(\'' + c.CategoryID + '\',this.checked)">' + esc(c.Name) + '</label><b>' + money(c.Fee) + '</b></div>' +

function drawHtml(catId) {

    out += '<div class="bracket">' + Object.keys(rounds).sort(function (a, b) { return a - b; }).map(function (r) {
      var list = rounds[r].sort(function (a, b) { return a.MatchNo - b.MatchNo; });

          (m.Result === 'Bye' ? '' : '<div class="s"><span>M' + m.MatchNo + (m.Date ? ' · ' + shortDay(m.Date) + ' ' + esc(m.Time) : '') + '</span><b>' + esc(m.Score) + '</b></div>') + '</div>';
      }).join('') + '</div></div>';
    }).join('') + '</div>';
  }
  if (rr.length) {
    var groups = {}; rr.forEach(function (m) { (groups[m.Group || ''] = groups[m.Group || ''] || []).push(m); });
    Object.keys(groups).sort().forEach(function (g) {
      var st = standings(groups[g], E);
      out += (g ? '<h3>Group ' + esc(g) + '</h3>' : '') + '<div class="tablewrap"><table><tr><th>#</th><th>Player / Team</th><th class="num">P</th><th class="num">W</th><th class="num">L</th><th class="num">Games</th></tr>' +
        st.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(r.name) + '</b><br><span class="muted small">' + esc(r.tower) + '</span></td><td class="num">' + r.p + '</td><td class="num">' + r.w + '</td><td class="num">' + r.l + '</td><td class="num">' + r.gf + '–' + r.ga + '</td></tr>'; }).join('') +
        '</table></div><div class="list">' + sortMatches(groups[g]).map(function (m) { return matchRow(m, E, F, cm, true); }).join('') + '</div>';
    });
  }

}
function seedTag(id, E) { var e = id && E[id]; var s = e && (e.seed || (e.raw && e.raw.Seed)); return s ? '<span class="badge pri">' + esc(s) + '</span>' : ''; }

function regGroups() {
  var g = {}; S.adm.entries.forEach(function (e) { (g[e.RegID] = g[e.RegID] || []).push(e); }); return g;
}
function capacity() {
  var d = S.adm, p = d.play, cm = catMap();
  var days = String(p.PlayDays || '').split(/\n|;/).map(function (l) { var m = l.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/); return m ? { date: m[1], mins: (+m[4] * 60 + +m[5]) - (+m[2] * 60 + +m[3]) } : null; }).filter(Boolean);
  var avail = days.reduce(function (s, x) { return s + Math.max(0, x.mins); }, 0) * (p.Courts || 1);
  var need = 0, matches = 0;
  // matches already drawn
  var drawn = {}; d.matches.forEach(function (m) { drawn[m.CategoryID] = true; if (m.Result !== 'Bye') { matches++; need += Number(cm[m.CategoryID] && cm[m.CategoryID].SlotMinutes) || p.DefaultSlotMinutes; } });
  // estimate for categories not drawn yet (from current entries)
  var est = 0;
  d.categories.forEach(function (c) {
    if (drawn[c.CategoryID]) return;
    var n = d.entries.filter(function (e) { return e.CategoryID === c.CategoryID && e.Status !== 'Withdrawn'; }).length;
    if (n < 2) return;
    var g = Math.max(1, Math.min(Number(c.Groups) || 1, Math.floor(n / 2)));
    var k = 0;
    if (c.Format === 'Round Robin') { var base = Math.floor(n / g), extra = n % g; for (var i = 0; i < g; i++) { var sz = base + (i < extra ? 1 : 0); k += sz * (sz - 1) / 2; } }
    else k = n - 1;
    est += k; need += k * (Number(c.SlotMinutes) || p.DefaultSlotMinutes);
  });
  return { days: days, avail: avail, need: need, matches: matches, est: est };
}

  var fees = appr.reduce(function (s, e) { return s + Number(e.Fee || 0); }, 0);
  var pendAmt = pend.reduce(function (s, e) { return s + Number(e.Fee || 0); }, 0);
  var inc = d.accounts.filter(function (t) { return t.Type === 'Income'; }).reduce(function (s, t) { return s + Number(t.Amount); }, 0);
  var exp = d.accounts.filter(function (t) { return t.Type === 'Expense'; }).reduce(function (s, t) { return s + Number(t.Amount); }, 0);
  var people = {}; live.forEach(function (e) { [e.P1Phone, e.P2Phone].forEach(function (p) { if (p) people[String(p)] = 1; }); if (!e.P2Phone && e.Player2) people[e.Player2.toLowerCase()] = 1; });
  var cap = capacity();

  return '<div class="grid" style="margin-bottom:14px">' + stat(Object.keys(regs).length, 'Registrations') + stat(Object.keys(people).length, 'Players') + stat(live.length, 'Entries') +
    stat(pend.length, 'Payments to approve') + stat(money(fees), 'Entry fees received') + stat(money(pendAmt), 'Fees pending') + stat(money(exp), 'Expenses') + stat(money(fees + inc - exp), 'Balance') + '</div>' +
    '<div class="card"><h2>Court time</h2>' +

    '<div style="height:10px;background:#eef1ed;border-radius:6px;overflow:hidden"><div style="height:10px;width:' + Math.min(100, pct) + '%;background:' + (pct > 100 ? 'var(--bad)' : pct > 85 ? 'var(--warn)' : 'var(--ok)') + '"></div></div>' +
    (pct > 100 ? '<div class="warnbox">You need about ' + pct + '% of the court time you have. Add play days (e.g. weekday evenings for early rounds), shorten match formats or cap entries.</div>' : '<p class="muted small">' + pct + '% of court time used.</p>') + '</div>' +
    '<div class="card"><h2>By category</h2><div class="tablewrap"><table><tr><th>Category</th><th class="num">Entries</th><th class="num">Approved</th><th class="num">Pending</th><th>Draw</th><th class="num">Played</th></tr>' +

  var text = '﻿' + csv(rows);
  try {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast('Downloading ' + name);
  } catch (e) {
    modal('<h2>' + esc(name) + '</h2><p class="small muted">Download was blocked. Copy the text below into Excel.</p><textarea style="min-height:300px">' + esc(text) + '</textarea>');
  }
}
VIEWS.export = function () {
  var d = S.adm, x = 'https://docs.google.com/spreadsheets/d/' + d.sheetId + '/export?format=xlsx';
  return '<div class="card"><h2>Export</h2><div class="grid"><button class="btn" onclick="exEntries()">Entries (CSV)</button><button class="btn" onclick="exMatches()">Matches &amp; results (CSV)</button><button class="btn" onclick="exStandings()">Standings &amp; winners (CSV)</button><button class="btn" onclick="exAccounts()">Accounts (CSV)</button></div>' +
    '<h3>Whole database</h3><div class="row"><a class="btn pri" href="' + x + '" target="_blank">Download as Excel (.xlsx)</a><a class="btn" href="' + esc(d.sheetUrl) + '" target="_blank">Open Google Sheet</a></div><p class="muted small">The Excel download and the sheet link work for Google accounts that have access to the sheet.</p></div>';
};
function exEntries() {
  var cm = catMap(), h = ['EntryID', 'RegID', 'Timestamp', 'Category', 'Player1', 'P1Tower', 'P1Flat', 'P1Phone', 'Player2', 'P2Tower', 'P2Flat', 'P2Phone', 'LastTournament', 'LastCategory', 'LastResult', 'Fee', 'PaymentMode', 'PaymentRef', 'PaymentStatus', 'ApprovedBy', 'ApprovedAt', 'Seed', 'Group', 'Status', 'Remarks'];
  download('auris-entries.csv', [h].concat(S.adm.entries.map(function (e) { return h.map(function (k) { return k === 'Category' ? (cm[e.CategoryID] ? cm[e.CategoryID].Name : e.CategoryID) : e[k]; }); })));
}
function exMatches() {
  var E = entMap(), F = feederMap(), cm = catMap();
  var h = ['Match no.', 'Category', 'Round', 'Group', 'Date', 'Time', 'Court', 'Side A', 'Side B', 'Score', 'Winner', 'Result', 'Entered by', 'Entered at'];
  download('auris-matches.csv', [h].concat(sortMatches(S.adm.matches).map(function (m) { return [m.MatchNo, cm[m.CategoryID] ? cm[m.CategoryID].Name : m.CategoryID, m.Round, m.Group, m.Date, m.Time, m.Court, sideName(m, 'A', E, F), sideName(m, 'B', E, F), m.Score, m.Winner && E[m.Winner] ? E[m.Winner].name : '', m.Result, m.EnteredBy, m.EnteredAt]; })));
}
function exStandings() {
  var E = entMap(), rows = [['Category', 'Stage', 'Group', 'Position', 'Player / Team', 'Played', 'Won', 'Lost', 'Games won', 'Games lost']];
  S.adm.categories.forEach(function (c) {
    var ms = S.adm.matches.filter(function (m) { return m.CategoryID === c.CategoryID; });
    var rr = ms.filter(function (m) { return m.Stage === 'RR'; }), groups = {};
    rr.forEach(function (m) { (groups[m.Group || ''] = groups[m.Group || ''] || []).push(m); });
    Object.keys(groups).sort().forEach(function (g) { standings(groups[g], E).forEach(function (r, i) { rows.push([c.Name, 'Round robin', g, i + 1, r.name, r.p, r.w, r.l, r.gf, r.ga]); }); });
    var fin = ms.filter(function (m) { return m.Stage === 'KO' && m.Round === 'Final'; })[0];
    if (fin && fin.Winner) { var ru = fin.Winner === fin.SideA ? fin.SideB : fin.SideA; rows.push([c.Name, 'Knockout', '', 'Winner', E[fin.Winner] ? E[fin.Winner].name : '', '', '', '', '', '']); rows.push([c.Name, 'Knockout', '', 'Runner-up', E[ru] ? E[ru].name : '', '', '', '', '', '']); }
  });
  download('auris-standings.csv', rows);
}
function exAccounts() {
  var a = accSummary(), rows = [['Date', 'Type', 'Head', 'Description', 'Party', 'Mode', 'Reference', 'Amount']];
  rows.push(['', 'Income', 'Entry fees – UPI (approved)', '', '', 'UPI', '', a.upi]);
  rows.push(['', 'Income', 'Entry fees – Cash (approved)', '', '', 'Cash', '', a.cash]);
  S.adm.accounts.forEach(function (t) { rows.push([t.Date, t.Type, t.Head, t.Description, t.Party, t.Mode, t.Reference, t.Type === 'Expense' ? -t.Amount : t.Amount]); });
  rows.push(['', '', '', '', '', '', 'Balance', a.ti - a.te]);
  download('auris-accounts.csv', rows);
}

/* ---------- SETTINGS (ADMIN) ---------- */
VIEWS.settings = function () {
  var rows = S.adm.settingsRaw;
  var long = { About: 1, Rules: 1, PlayDays: 1, PaymentNote: 1 };
  return '<div class="card"><h2>Settings</h2>' + rows.map(function (r, i) {
    return '<label>' + esc(r.Key.replace(/([a-z])([A-Z])/g, '$1 $2')) + (r.Notes ? ' <span style="font-weight:400">– ' + esc(r.Notes) + '</span>' : '') + '</label>' +
      (long[r.Key] ? '<textarea id="st_' + i + '">' + esc(r.Value) + '</textarea>' : '<input id="st_' + i + '" value="' + esc(r.Value) + '">');
  }).join('') + '<button class="btn pri block" style="margin-top:16px" onclick="saveSettings(this)">Save settings</button></div>';
};
function saveSettings(btn) {
  var p = {}; S.adm.settingsRaw.forEach(function (r, i) { p[r.Key] = $('st_' + i).value; });
  busy(btn, true); call('saveSettings', p).then(function () { toast('Settings saved'); return boot(); }).catch(function (e) { busy(btn, false); fail(e); });
}

/* ---------- USERS (ADMIN) ---------- */
VIEWS.users = function () {
  return '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Staff logins</h2><button class="btn pri sm" onclick="userModal()">+ Add person</button></div>' +
    '<p class="muted small"><b>Admin</b>: everything incl. settings and logins. <b>Organiser</b>: entries, payments, draws, schedule, scores, accounts, print, export. <b>Scorer</b>: enter scores and print score cards only.</p>' +
    '<table><tr><th>Name</th><th>Role</th><th>PIN</th><th>Active</th><th></th></tr>' + S.adm.users.map(function (u) { return '<tr><td><b>' + esc(u.Name) + '</b></td><td>' + esc(u.Role) + '</td><td>' + esc(u.PIN) + '</td><td>' + esc(u.Active) + '</td><td><button class="btn sm" onclick="userModal(\'' + esc(u.Name) + '\')">Edit</button></td></tr>'; }).join('') + '</table></div>';
};
function userModal(name) {
  var u = name ? S.adm.users.filter(function (x) { return x.Name === name; })[0] : { Name: '', Role: 'Scorer', PIN: String(Math.floor(1000 + Math.random() * 9000)), Active: 'Yes' };
  modal('<h2>' + (name ? 'Edit' : 'Add') + ' login</h2><label>Name</label><input id="u_Name" value="' + esc(u.Name) + '" ' + (name ? 'readonly' : '') + '>' +
    '<label>Role</label><select id="u_Role">' + ['Scorer', 'Organiser', 'Admin'].map(function (r) { return '<option ' + (u.Role === r ? 'selected' : '') + '>' + r + '</option>'; }).join('') + '</select>' +
    '<label>PIN (4–8 digits)</label><input id="u_PIN" inputmode="numeric" value="' + esc(u.PIN) + '"><label>Active</label><select id="u_Active"><option ' + (u.Active !== 'No' ? 'selected' : '') + '>Yes</option><option ' + (u.Active === 'No' ? 'selected' : '') + '>No</option></select>' +
    '<button class="btn pri block" style="margin-top:14px" onclick="saveUser(this)">Save</button>' + (name ? '<button class="btn bad block" style="margin-top:8px" onclick="delUser(\'' + esc(name) + '\',this)">Remove</button>' : ''));
}
function saveUser(btn) { busy(btn, true); call('saveUser', { Name: val('u_Name'), Role: val('u_Role'), PIN: val('u_PIN'), Active: val('u_Active') }).then(function () { closeModal(); toast('Saved'); return refreshData(); }).catch(function (e) { busy(btn, false); fail(e); }); }
function delUser(name, btn) { if (!confirmBox('Remove ' + name + '?')) return; busy(btn, true); call('deleteUser', { Name: name }).then(function () { closeModal(); toast('Removed'); return refreshData(); }).catch(function (e) { busy(btn, false); fail(e); }); }

boot();
</script>
</body>
</html>
