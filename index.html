    '<div><label>Date</label><input type="date" id="t_Date" value="' + esc(t.Date) + '"></div><div><label>Head</label><select id="t_Head">' + heads(t.Type) + '</select></div><div><label>Amount (₹)</label><input type="number" id="t_Amount" value="' + esc(t.Amount) + '"></div>' +
    '<div><label>Mode</label><select id="t_Mode">' + ['UPI', 'Cash', 'Bank transfer', 'Cheque'].map(function (m) { return '<option ' + (t.Mode === m ? 'selected' : '') + '>' + m + '</option>'; }).join('') + '</select></div><div><label>Paid to / received from</label><input id="t_Party" value="' + esc(t.Party) + '"></div></div>' +
    '<label>Description</label><input id="t_Description" value="' + esc(t.Description) + '"><label>Bill / reference no.</label><input id="t_Reference" value="' + esc(t.Reference) + '">' +
    '<button class="btn pri block" style="margin-top:14px" onclick="saveTxn(\'' + (id || '') + '\',this)">Save</button>' + (id ? '<button class="btn bad block" style="margin-top:8px" onclick="delTxn(\'' + id + '\',this)">Delete</button>' : ''));
}
function saveTxn(id, btn) {
  var p = { TxnID: id }; ['Type', 'Date', 'Head', 'Amount', 'Mode', 'Party', 'Description', 'Reference'].forEach(function (k) { p[k] = val('t_' + k); });
  busy(btn, true); call('saveTxn', p).then(function () { closeModal(); toast('Saved'); return refreshData(); }).catch(function (e) { busy(btn, false); fail(e); });
}
function delTxn(id, btn) { if (!confirmBox('Delete this transaction?')) return; busy(btn, true); call('deleteTxn', { TxnID: id }).then(function () { closeModal(); toast('Deleted'); return refreshData(); }).catch(function (e) { busy(btn, false); fail(e); }); }

/* ---------- PRINT ---------- */
VIEWS.print = function () {
  var d = D(), cats = d.categories.slice().sort(function (a, b) { return a.Order - b.Order; });
  var dates = {}; d.matches.forEach(function (m) { if (m.Date) dates[m.Date] = 1; });
  var catSel = '<select id="p_cat"><option value="">All categories</option>' + cats.map(function (c) { return '<option value="' + c.CategoryID + '">' + esc(c.Name) + '</option>'; }).join('') + '</select>';
  var daySel = '<select id="p_day"><option value="">All days</option>' + Object.keys(dates).sort().map(function (k) { return '<option value="' + k + '">' + dayLabel(k) + '</option>'; }).join('') + '</select>';
  return '<div class="card"><h2>Print</h2><div class="grid2"><div><label>Category</label>' + catSel + '</div><div><label>Day</label>' + daySel + '</div></div>' +
    '<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="p_pend" style="width:auto" checked> Only matches not yet played</label>' +
    '<div class="grid" style="margin-top:14px"><button class="btn pri" onclick="printCards()">Referee score cards</button><button class="btn" onclick="printOrder()">Order of play</button><button class="btn" onclick="printDraws()">Draw sheets</button>' +
    (isStaff() ? '<button class="btn" onclick="printEntries()">Entry / sign-in list</button><button class="btn" onclick="printAccounts()">Accounts statement</button>' : '') + '</div>' +
    '<p class="muted small">Score cards print two per A4 page. The referee writes the games for each set, the final score and the winner; a scorer then enters the final score here.</p></div>';
};
function printMatches() {
  var cat = val('p_cat'), day = val('p_day'), pend = $('p_pend').checked;
  return sortMatches(D().matches.filter(function (m) { return m.Result !== 'Bye' && (!cat || m.CategoryID === cat) && (!day || m.Date === day) && (!pend || m.Result === 'Pending'); }));
}
function doPrint(html) { $('print').innerHTML = html; setTimeout(function () { window.print(); }, 150); }
function printCards() {
  var E = entMap(), F = feederMap(), cm = catMap(), t = D().settings.TournamentName;
  var ms = printMatches(); if (!ms.length) return toast('No matches for this selection.', true);
  doPrint(ms.map(function (m) {
    var row = function (slot) { return '<tr><td style="width:38%"><b>' + esc(sideName(m, slot, E, F)) + '</b><br><span style="font-size:10px">' + esc(sideTower(m, slot, E)) + '</span></td><td></td><td></td><td></td><td></td><td></td></tr>'; };
    return '<div class="pc"><div class="hd"><div><h4>' + esc(t) + '</h4><div>' + esc(cm[m.CategoryID] ? cm[m.CategoryID].Name : '') + ' · ' + esc(m.Round) + '</div></div><div style="text-align:right"><h4>Match ' + m.MatchNo + '</h4><div>' + esc(m.Date ? shortDay(m.Date) : '') + ' ' + esc(m.Time || '') + (m.Court ? ' · Court ' + esc(m.Court) : '') + '</div></div></div>' +
      '<p style="margin:4px 0 8px">Format for this round: ______________________ &nbsp; Start time: ________ &nbsp; End time: ________</p>' +
      '<table style="width:100%;border-collapse:collapse"><tr><th>Player / Team</th><th>Set 1</th><th>Set 2</th><th>Set 3</th><th>Set 4</th><th>Set 5</th></tr>' + row('A') + row('B') + '</table>' +
      '<p style="margin:14px 0 4px">Final score (winner first): ______________________ &nbsp;&nbsp; Winner: ___________________________________</p>' +
      '<p style="margin:8px 0">☐ Completed &nbsp;&nbsp; ☐ Walkover &nbsp;&nbsp; ☐ Retired &nbsp;&nbsp; Notes: _________________________________________</p>' +
      '<div class="sig"><div>Referee name &amp; signature</div><div>Player A signature</div><div>Player B signature</div></div></div>';
  }).join(''));
}
function printOrder() {
  var E = entMap(), F = feederMap(), cm = catMap(), t = D().settings.TournamentName, ms = printMatches();
  if (!ms.length) return toast('No matches for this selection.', true);
  var by = {}; ms.forEach(function (m) { (by[m.Date || ''] = by[m.Date || ''] || []).push(m); });
  doPrint(Object.keys(by).sort().map(function (k) {
    return '<div class="pp pb"><h2>' + esc(t) + ' – Order of play</h2><h3>' + esc(dayLabel(k)) + '</h3><table style="width:100%;border-collapse:collapse"><tr><th>Time</th><th>M#</th><th>Category</th><th>Round</th><th>Side A</th><th>Side B</th><th>Score</th></tr>' +
      by[k].map(function (m) { return '<tr><td>' + esc(m.Time) + '</td><td>' + m.MatchNo + '</td><td>' + esc(cm[m.CategoryID] ? cm[m.CategoryID].Name : '') + '</td><td>' + esc(m.Round) + '</td><td>' + esc(sideName(m, 'A', E, F)) + '</td><td>' + esc(sideName(m, 'B', E, F)) + '</td><td style="min-width:80px">' + esc(m.Result !== 'Pending' ? m.Score : '') + '</td></tr>'; }).join('') + '</table></div>';
  }).join(''));
}
function printDraws() {
  var cat = val('p_cat'), t = D().settings.TournamentName;
  var cats = D().categories.filter(function (c) { return (!cat || c.CategoryID === cat) && D().matches.some(function (m) { return m.CategoryID === c.CategoryID; }); });
  if (!cats.length) return toast('No draws made yet.', true);
  doPrint(cats.map(function (c) { return '<div class="pp pb"><h2>' + esc(t) + ' – ' + esc(c.Name) + '</h2>' + drawHtml(c.CategoryID) + '</div>'; }).join('') +
    '<style>@media print{.bracket{flex-wrap:nowrap;overflow:visible}.bround,.bcol{min-width:0;flex:1}.bm{font-size:10px}}</style>');
}
function printEntries() {
  var cat = val('p_cat'), cm = catMap(), t = D().settings.TournamentName;
  var cats = S.adm.categories.filter(function (c) { return !cat || c.CategoryID === cat; }).sort(function (a, b) { return a.Order - b.Order; });
  doPrint(cats.map(function (c) {
    var es = S.adm.entries.filter(function (e) { return e.CategoryID === c.CategoryID && e.Status !== 'Withdrawn'; });
    return '<div class="pp pb"><h2>' + esc(t) + ' – ' + esc(c.Name) + ' (' + es.length + ')</h2><table style="width:100%;border-collapse:collapse"><tr><th>#</th><th>Player / Team</th><th>Tower / Flat</th><th>Mobile</th><th>Seed</th><th>Payment</th><th>Sign-in</th></tr>' +
      es.map(function (e, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(e.Player1) + (e.Player2 ? ' / ' + esc(e.Player2) : '') + '</td><td>' + esc(e.P1Tower + ' ' + e.P1Flat) + '</td><td>' + esc(e.P1Phone) + '</td><td>' + esc(e.Seed) + '</td><td>' + esc(e.PaymentStatus + ' · ' + e.PaymentMode) + '</td><td style="width:90px"></td></tr>'; }).join('') + '</table></div>';
  }).join(''));
}
function printAccounts() {
  var a = accSummary(), d = S.adm, t = d.settings.TournamentName;
  var line = function (l, v) { return '<tr><td>' + l + '</td><td style="text-align:right">' + money(v) + '</td></tr>'; };
  doPrint('<div class="pp"><h2>' + esc(t) + ' – Accounts statement</h2><p>Printed ' + new Date().toLocaleString('en-GB') + '</p><h3>Income</h3><table style="width:100%;border-collapse:collapse">' + line('Entry fees – UPI', a.upi) + line('Entry fees – Cash', a.cash) + Object.keys(a.inc).map(function (k) { return line(esc(k), a.inc[k]); }).join('') + line('<b>Total income</b>', a.ti) + '</table>' +
    '<h3>Expenses</h3><table style="width:100%;border-collapse:collapse">' + Object.keys(a.exp).map(function (k) { return line(esc(k), a.exp[k]); }).join('') + line('<b>Total expenses</b>', a.te) + '</table><h3>Balance: ' + money(a.ti - a.te) + '</h3>' +
    '<h3>Transactions</h3><table style="width:100%;border-collapse:collapse"><tr><th>Date</th><th>Type</th><th>Head</th><th>Description</th><th>Party</th><th>Ref</th><th>Amount</th></tr>' + d.accounts.map(function (x) { return '<tr><td>' + esc(x.Date) + '</td><td>' + esc(x.Type) + '</td><td>' + esc(x.Head) + '</td><td>' + esc(x.Description) + '</td><td>' + esc(x.Party) + '</td><td>' + esc(x.Reference) + '</td><td style="text-align:right">' + money(x.Amount) + '</td></tr>'; }).join('') + '</table>' +
    '<div class="sig" style="display:flex;gap:40px;margin-top:40px"><div style="flex:1;border-top:1px solid #000">Treasurer</div><div style="flex:1;border-top:1px solid #000">Organiser</div></div></div>');
}

/* ---------- EXPORT ---------- */
function csv(rows) { return rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n'); }
function download(name, rows) {
  var text = '﻿' + csv(rows);
  try {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast('Downloading ' + name);
  } catch (e) {
    modal('<h2>' + esc(name) + '</h2><p class="small muted">Download was blocked. Copy the text below into Excel.</p><textarea style="min-height:300px">' + esc(text) + '</textarea>');
  }
}
VIEWS.export = function () {
  var d = S.adm, x = 'https://docs.google.com/spreadsheets/d/' + d.sheetId + '/export?format=xlsx';
  return '<div class="card"><h2>Export</h2><div class="grid"><button class="btn" onclick="exEntries()">Entries (CSV)</button><button class="btn" onclick="exMatches()">Matches &amp; results (CSV)</button><button class="btn" onclick="exStandings()">Standings &amp; winners (CSV)</button><button class="btn" onclick="exAccounts()">Accounts (CSV)</button></div>' +
    '<h3>Whole database</h3><div class="row"><a class="btn pri" href="' + x + '" target="_blank">Download as Excel (.xlsx)</a><a class="btn" href="' + esc(d.sheetUrl) + '" target="_blank">Open Google Sheet</a></div><p class="muted small">The Excel download and the sheet link work for Google accounts that have access to the sheet.</p></div>';
};
function exEntries() {
  var cm = catMap(), h = ['EntryID', 'RegID', 'Timestamp', 'Category', 'Player1', 'P1Tower', 'P1Flat', 'P1Phone', 'Player2', 'P2Tower', 'P2Flat', 'P2Phone', 'LastTournament', 'LastCategory', 'LastResult', 'Fee', 'PaymentMode', 'PaymentRef', 'PaymentStatus', 'ApprovedBy', 'ApprovedAt', 'Seed', 'Group', 'Status', 'Remarks'];
  download('auris-entries.csv', [h].concat(S.adm.entries.map(function (e) { return h.map(function (k) { return k === 'Category' ? (cm[e.CategoryID] ? cm[e.CategoryID].Name : e.CategoryID) : e[k]; }); })));
}
function exMatches() {
  var E = entMap(), F = feederMap(), cm = catMap();
  var h = ['Match no.', 'Category', 'Round', 'Group', 'Date', 'Time', 'Court', 'Side A', 'Side B', 'Score', 'Winner', 'Result', 'Entered by', 'Entered at'];
  download('auris-matches.csv', [h].concat(sortMatches(S.adm.matches).map(function (m) { return [m.MatchNo, cm[m.CategoryID] ? cm[m.CategoryID].Name : m.CategoryID, m.Round, m.Group, m.Date, m.Time, m.Court, sideName(m, 'A', E, F), sideName(m, 'B', E, F), m.Score, m.Winner && E[m.Winner] ? E[m.Winner].name : '', m.Result, m.EnteredBy, m.EnteredAt]; })));
}
function exStandings() {
  var E = entMap(), rows = [['Category', 'Stage', 'Group', 'Position', 'Player / Team', 'Played', 'Won', 'Lost', 'Games won', 'Games lost']];
  S.adm.categories.forEach(function (c) {
    var ms = S.adm.matches.filter(function (m) { return m.CategoryID === c.CategoryID; });
    var rr = ms.filter(function (m) { return m.Stage === 'RR'; }), groups = {};
    rr.forEach(function (m) { (groups[m.Group || ''] = groups[m.Group || ''] || []).push(m); });
    Object.keys(groups).sort().forEach(function (g) { standings(groups[g], E).forEach(function (r, i) { rows.push([c.Name, 'Round robin', g, i + 1, r.name, r.p, r.w, r.l, r.gf, r.ga]); }); });
    var fin = ms.filter(function (m) { return m.Stage === 'KO' && m.Round === 'Final'; })[0];
    if (fin && fin.Winner) { var ru = fin.Winner === fin.SideA ? fin.SideB : fin.SideA; rows.push([c.Name, 'Knockout', '', 'Winner', E[fin.Winner] ? E[fin.Winner].name : '', '', '', '', '', '']); rows.push([c.Name, 'Knockout', '', 'Runner-up', E[ru] ? E[ru].name : '', '', '', '', '', '']); }
  });
  download('auris-standings.csv', rows);
}
function exAccounts() {
  var a = accSummary(), rows = [['Date', 'Type', 'Head', 'Description', 'Party', 'Mode', 'Reference', 'Amount']];
  rows.push(['', 'Income', 'Entry fees – UPI (approved)', '', '', 'UPI', '', a.upi]);
  rows.push(['', 'Income', 'Entry fees – Cash (approved)', '', '', 'Cash', '', a.cash]);
  S.adm.accounts.forEach(function (t) { rows.push([t.Date, t.Type, t.Head, t.Description, t.Party, t.Mode, t.Reference, t.Type === 'Expense' ? -t.Amount : t.Amount]); });
  rows.push(['', '', '', '', '', '', 'Balance', a.ti - a.te]);
  download('auris-accounts.csv', rows);
}

VIEWS.users = function () {

    '<label>PIN (4–8 digits)</label><input id="u_PIN" inputmode="numeric" value="' + esc(u.PIN) + '"><label>Active</label><select id="u_Active"><option ' + (u.Active !== 'No' ? 'selected' : '') + '>Yes</option><option ' + (u.Active === 'No' ? 'selected' : '') + '>No</option></select>' +

}
function saveUser(btn) { busy(btn, true); call('saveUser', { Name: val('u_Name'), Role: val('u_Role'), PIN: val('u_PIN'), Active: val('u_Active') }).then(function () { closeModal(); toast('Saved'); return refreshData(); }).catch(function (e) { busy(btn, false); fail(e); }); }
function delUser(name, btn) { if (!confirmBox('Remove ' + name + '?')) return; busy(btn, true); call('deleteUser', { Name: name }).then(function () { closeModal(); toast('Removed'); return refreshData(); }).catch(function (e) { busy(btn, false); fail(e); }); }

boot();
