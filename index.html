<!DOCTYPE html>

<script>
/* ===== DEMO MODE: runs the real backend (Code.gs) inside the browser with in-memory data ===== */
(function () {
  function conv(v) {
    if (typeof v === 'string') { if (v.charAt(0) === "'") return v.slice(1); if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v); }
    return v === undefined || v === null ? '' : v;
  }
  function Range(sh, r, c, nr, nc) { this.sh = sh; this.r = r; this.c = c; this.nr = nr || 1; this.nc = nc || 1; }
  Range.prototype.getValues = function () { var out = []; for (var i = 0; i < this.nr; i++) { var row = this.sh.data[this.r - 1 + i] || [], o = []; for (var j = 0; j < this.nc; j++) o.push(row[this.c - 1 + j] === undefined ? '' : row[this.c - 1 + j]); out.push(o); } return out; };
  Range.prototype.setValues = function (v) { for (var i = 0; i < this.nr; i++) { var ri = this.r - 1 + i; while (this.sh.data.length <= ri) this.sh.data.push([]); for (var j = 0; j < this.nc; j++) this.sh.data[ri][this.c - 1 + j] = conv(v[i][j]); } return this; };
  Range.prototype.setValue = function (x) { return this.setValues([[x]]); };
  Range.prototype.clearContent = function () { for (var i = 0; i < this.nr; i++) { var row = this.sh.data[this.r - 1 + i]; if (row) for (var j = 0; j < this.nc; j++) row[this.c - 1 + j] = ''; } return this; };
  Range.prototype.setFontWeight = function () { return this; };
  function Sheet(name) { this.name = name; this.data = []; }
  Sheet.prototype.getLastRow = function () { for (var i = this.data.length - 1; i >= 0; i--) if ((this.data[i] || []).some(function (v) { return v !== '' && v !== undefined; })) return i + 1; return 0; };
  Sheet.prototype.getRange = function (r, c, nr, nc) { return new Range(this, r, c, nr, nc); };
  Sheet.prototype.appendRow = function (arr) { var at = this.getLastRow(); this.data.length = at; this.data.push(arr.map(conv)); };
  Sheet.prototype.deleteRow = function (r) { this.data.splice(r - 1, 1); };
  Sheet.prototype.setFrozenRows = function () {};
  var sheets = {};
  var ss = {
    getSheetByName: function (n) { return sheets[n] || null; }, insertSheet: function (n) { return (sheets[n] = new Sheet(n)); },
    getSheets: function () { return Object.keys(sheets).map(function (k) { return sheets[k]; }); }, deleteSheet: function (s) { delete sheets[s.name]; },
    getUrl: function () { return '#demo-sheet'; }, getId: function () { return 'DEMO'; }
  };
  var cache = {}, files = {};
  var uuid = function () { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }); };
  var folder = { createFile: function (b) { var id = 'F' + uuid().slice(0, 8); files[id] = b; return { getId: function () { return id; } }; } };
  var G = {
    SpreadsheetApp: { getActiveSpreadsheet: function () { return ss; }, openById: function () { return ss; } },
    LockService: { getScriptLock: function () { return { waitLock: function () {}, releaseLock: function () {} }; } },
    CacheService: { getScriptCache: function () { return { get: function (k) { return cache[k] || null; }, put: function (k, v) { cache[k] = v; } }; } },
    Session: { getScriptTimeZone: function () { return 'Asia/Kolkata'; } },
    Utilities: {
      getUuid: uuid,
      base64Decode: function (s) { var b = atob(s), a = new Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; },
      base64Encode: function (a) { var s = ''; for (var i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.slice(i, i + 8192)); return btoa(s); },
      newBlob: function (bytes, mime) { return { getBytes: function () { return bytes; }, getContentType: function () { return mime; } }; },
      formatDate: function (d, tz, f) {
        var p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
        var g = function (t) { return p.filter(function (x) { return x.type === t; })[0].value; };
        return f.replace('yyyy', g('year')).replace('MM', g('month')).replace('dd', g('day')).replace('HH', g('hour')).replace('mm', g('minute'));
      }
    },
    DriveApp: {
      getFoldersByName: function () { var done = false; return { hasNext: function () { return !done; }, next: function () { done = true; return folder; } }; },
      createFolder: function () { return folder; }, getFileById: function (id) { return { getBlob: function () { return files[id]; } }; }
    }
  };
  var backend = (function (SpreadsheetApp, LockService, CacheService, Session, Utilities, DriveApp, HtmlService) {
/**
 * AURIS OPEN – Tournament Portal (Google Apps Script backend)
 * Database: the Google Sheet this script is attached to.
 * Free: runs on your Google account only.
 *
 * First time:  Run  setup()  once from the Apps Script editor (grants permissions, builds tabs).
 * Then:        Deploy > New deployment > Web app > Execute as: Me, Who has access: Anyone.
 */

// Leave blank when the script is attached to the sheet (Extensions > Apps Script).
var SHEET_ID = '';
var SCREENSHOT_FOLDER = 'Auris Open - Payment Screenshots';
var SESSION_HOURS = 6;

var TABS = {
  Settings:   ['Key', 'Value', 'Notes'],
  Users:      ['Name', 'Role', 'PIN', 'Active'],
  Categories: ['CategoryID', 'Name', 'Type', 'Format', 'Groups', 'Fee', 'MaxEntries', 'SlotMinutes', 'Status', 'Order', 'Notes'],
  Entries:    ['EntryID', 'RegID', 'Timestamp', 'CategoryID', 'Player1', 'P1Tower', 'P1Flat', 'P1Phone',
               'Player2', 'P2Tower', 'P2Flat', 'P2Phone', 'LastTournament', 'LastCategory', 'LastResult',
               'Fee', 'PaymentMode', 'PaymentRef', 'ScreenshotID', 'PaymentStatus', 'ApprovedBy', 'ApprovedAt',
               'Seed', 'Group', 'Status', 'Remarks'],
  Matches:    ['MatchID', 'CategoryID', 'Stage', 'Round', 'RoundNo', 'Group', 'MatchNo', 'SideA', 'SideB',
               'NextMatch', 'NextSlot', 'Date', 'Time', 'Court', 'Score', 'Winner', 'Result',
               'EnteredBy', 'EnteredAt', 'Notes'],
  Accounts:   ['TxnID', 'Date', 'Type', 'Head', 'Description', 'Amount', 'Mode', 'Party', 'Reference', 'EnteredBy', 'EnteredAt'],
  Log:        ['Timestamp', 'User', 'Action', 'Details']
};

var DEFAULT_SETTINGS = [
  ['TournamentName', 'Auris Open 2026', 'Shown on every page'],
  ['Tagline', 'Auris Serenity Towers 1, 2 & 3', ''],
  ['Venue', 'Auris Serenity society tennis court', ''],
  ['Dates', 'To be confirmed', 'Free text shown to players'],
  ['About', 'Our annual society tennis tournament. Register below, pay the entry fee and check your draw and match times here.', ''],
  ['RegistrationOpen', 'Yes', 'Yes / No'],
  ['MaxCategoriesPerPlayer', '2', 'Per person (by phone number)'],
  ['UPIId', '', 'e.g. organiser@okhdfcbank – used for the QR code'],

  ['PaymentNote', 'Pay by UPI and upload the screenshot, or choose Cash and hand it to the organiser. Your entry is confirmed once the organiser approves it.', ''],
  ['ContactName', '', 'Organiser to contact'],
  ['ContactPhone', '', ''],
  ['PlayDays', '2026-11-07 07:00-19:00\n2026-11-08 07:00-19:00', 'One line per day: YYYY-MM-DD HH:MM-HH:MM (add weekday evenings as extra lines)'],
  ['Courts', '1', 'Number of courts'],
  ['DefaultSlotMinutes', '40', 'Minutes per match incl. changeover (category can override)'],
  ['RestMinutes', '30', 'Minimum gap between two matches of the same player'],
  ['IncomeHeads', 'Donation, Society contribution, Sponsorship, Other income', 'Entry fees are counted automatically'],
  ['ExpenseHeads', 'Balls, Trophies & medals, Refreshments, Referees, Court & equipment, Printing & banners, First aid, Miscellaneous', ''],
  ['Rules', 'Report 15 minutes before your match time.\nA player not on court 10 minutes after the call loses by walkover.\nMatch format for each round is announced by the organisers.\nThe referee\'s decision is final.', 'Shown on the Home page']
];

var DEFAULT_CATEGORIES = [
  ['MS', "Men's Singles", 'Singles', 'Knockout', 1, 500, 32, '', 'Open', 1, ''],
  ['WS', "Women's Singles", 'Singles', 'Round Robin', 1, 500, 16, '', 'Open', 2, ''],
  ['MD', "Men's Doubles", 'Doubles', 'Knockout', 1, 800, 16, '', 'Open', 3, 'Fee per pair'],
  ['WD', "Women's Doubles", 'Doubles', 'Round Robin', 1, 800, 8, '', 'Open', 4, 'Fee per pair'],
  ['XD', 'Mixed Doubles', 'Doubles', 'Knockout', 1, 800, 16, '', 'Open', 5, 'Fee per pair'],
  ['JR', 'Juniors (U-14)', 'Singles', 'Round Robin', 1, 300, 16, 30, 'Open', 6, '']
];

/* ======================= WEB APP ======================= */

function doGet() {
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle('Auris Open')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, maximum-scale=1');
}

/** Single entry point used by the page: google.script.run.api(action, payloadJson, token) */
function api(action, payloadJson, token) {
  try {
    var p = payloadJson ? JSON.parse(payloadJson) : {};
    var fn = ACTIONS[action];
    if (!fn) throw new Error('Unknown action: ' + action);
    var user = null;
    if (fn.role) {
      user = checkToken_(token);
      if (!user) throw new Error('Session expired. Please log in again.');
      if (fn.role === 'Admin' && user.role !== 'Admin') throw new Error('Only an Admin can do this.');
      if (fn.role === 'Organiser' && user.role === 'Scorer') throw new Error('Scorers can only enter scores.');
    }
    var out;
    if (fn.write) {
      var lock = LockService.getScriptLock();
      lock.waitLock(20000);
      try { out = fn.run(p, user); } finally { lock.releaseLock(); }
    } else {
      out = fn.run(p, user);
    }
    return JSON.stringify({ ok: true, data: out === undefined ? null : out });
  } catch (e) {
    return JSON.stringify({ ok: false, error: String(e && e.message || e) });
  }
}

var ACTIONS = {
  // ---- public ----
  getPublic:   { run: function () { return publicData_(); } },
  register:    { write: true, run: function (p) { return register_(p); } },
  lookup:      { run: function (p) { return lookup_(p.phone); } },
  login:       { run: function (p) { return login_(p.name, p.pin); } },
  // ---- scorer + above ----
  getScorer:   { role: 'Scorer', run: function () { return scorerData_(); } },
  saveScore:   { role: 'Scorer', write: true, run: function (p, u) { return saveScore_(p, u); } },
  // ---- organiser + admin ----
  getAdmin:    { role: 'Organiser', run: function (p, u) { return adminData_(u); } },
  setPayment:  { role: 'Organiser', write: true, run: function (p, u) { return setPayment_(p, u); } },
  updateEntry: { role: 'Organiser', write: true, run: function (p, u) { return updateEntry_(p, u); } },
  addEntry:    { role: 'Organiser', write: true, run: function (p, u) { return addEntryAdmin_(p, u); } },
  deleteEntry: { role: 'Organiser', write: true, run: function (p, u) { return deleteEntry_(p, u); } },
  getScreenshot: { role: 'Organiser', run: function (p) { return getScreenshot_(p.id); } },
  saveCategory:  { role: 'Organiser', write: true, run: function (p, u) { return saveCategory_(p, u); } },
  deleteCategory:{ role: 'Organiser', write: true, run: function (p, u) { return deleteCategory_(p, u); } },
  generateDraw:  { role: 'Organiser', write: true, run: function (p, u) { return generateDraw_(p, u); } },
  clearDraw:     { role: 'Organiser', write: true, run: function (p, u) { return clearDraw_(p, u); } },
  editMatch:     { role: 'Organiser', write: true, run: function (p, u) { return editMatch_(p, u); } },
  addMatch:      { role: 'Organiser', write: true, run: function (p, u) { return addMatch_(p, u); } },
  deleteMatch:   { role: 'Organiser', write: true, run: function (p, u) { return deleteMatch_(p, u); } },
  clearScore:    { role: 'Organiser', write: true, run: function (p, u) { return clearScore_(p, u); } },
  autoSchedule:  { role: 'Organiser', write: true, run: function (p, u) { return autoSchedule_(p, u); } },
  saveTxn:       { role: 'Organiser', write: true, run: function (p, u) { return saveTxn_(p, u); } },
  deleteTxn:     { role: 'Organiser', write: true, run: function (p, u) { return deleteTxn_(p, u); } },
  // ---- admin only ----
  saveSettings:  { role: 'Admin', write: true, run: function (p, u) { return saveSettings_(p, u); } },
  saveUser:      { role: 'Admin', write: true, run: function (p, u) { return saveUser_(p, u); } },
  deleteUser:    { role: 'Admin', write: true, run: function (p, u) { return deleteUser_(p, u); } }
};

/* ======================= SETUP ======================= */

function setup() {
  var ss = ss_();
  Object.keys(TABS).forEach(function (name) {
    var sh = ss.getSheetByName(name);
    if (!sh) sh = ss.insertSheet(name);
    var headers = TABS[name];
    if (sh.getLastRow() === 0) {
      sh.getRange(1, 1, 1, headers.length).setValues([headers]);
      sh.getRange(1, 1, 1, headers.length).setFontWeight('bold');
      sh.setFrozenRows(1);
    }
  });
  if (readTable_('Settings').length === 0) {
    DEFAULT_SETTINGS.forEach(function (r) { appendObj_('Settings', { Key: r[0], Value: r[1], Notes: r[2] }); });
  } else {
    var have = {};
    readTable_('Settings').forEach(function (r) { have[r.Key] = true; });
    DEFAULT_SETTINGS.forEach(function (r) { if (!have[r[0]]) appendObj_('Settings', { Key: r[0], Value: r[1], Notes: r[2] }); });
  }
  if (readTable_('Users').length === 0) {
    appendObj_('Users', { Name: 'Admin', Role: 'Admin', PIN: '1234', Active: 'Yes' });
  }
  if (readTable_('Categories').length === 0) {
    DEFAULT_CATEGORIES.forEach(function (c) {
      var o = {}; TABS.Categories.forEach(function (h, i) { o[h] = c[i]; });
      appendObj_('Categories', o);
    });
  }
  var s1 = ss.getSheetByName('Sheet1');
  if (s1 && ss.getSheets().length > 1 && s1.getLastRow() === 0) ss.deleteSheet(s1);
  screenshotFolder_();
  return 'Setup complete';
}

/* ======================= SHEET HELPERS ======================= */

function ss_() { return SHEET_ID ? SpreadsheetApp.openById(SHEET_ID) : SpreadsheetApp.getActiveSpreadsheet(); }

function sheet_(name) {
  var sh = ss_().getSheetByName(name);
  if (!sh) throw new Error('Tab "' + name + '" is missing. Run setup() once from the script editor.');
  return sh;
}

function readTable_(name) {
  var sh = sheet_(name);
  var last = sh.getLastRow();
  var headers = TABS[name];
  if (last < 2) return [];
  var vals = sh.getRange(2, 1, last - 1, headers.length).getValues();
  var out = [];
  for (var i = 0; i < vals.length; i++) {
    var row = vals[i];
    var empty = true;
    var o = { _row: i + 2 };
    for (var j = 0; j < headers.length; j++) {
      var v = row[j];
      if (v instanceof Date) v = fmtDate_(v, headers[j] === 'Time' ? 'HH:mm' : (headers[j] === 'Date' ? 'yyyy-MM-dd' : 'yyyy-MM-dd HH:mm'));
      if (v !== '' && v !== null) empty = false;
      o[headers[j]] = v;
    }
    if (!empty) out.push(o);
  }
  return out;
}

function cell_(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number' || typeof v === 'boolean') return v;
  v = String(v);
  return v === '' ? '' : "'" + v; // force text so "4-1" never becomes a date
}

function rowArr_(name, obj) { return TABS[name].map(function (h) { return cell_(obj[h]); }); }

function appendObj_(name, obj) { sheet_(name).appendRow(rowArr_(name, obj)); }

function appendMany_(name, objs) {
  if (!objs.length) return;
  var sh = sheet_(name);
  var start = Math.max(sh.getLastRow(), 1) + 1;
  sh.getRange(start, 1, objs.length, TABS[name].length).setValues(objs.map(function (o) { return rowArr_(name, o); }));
}

function updateObj_(name, obj) {
  if (!obj._row) throw new Error('Row not found');
  sheet_(name).getRange(obj._row, 1, 1, TABS[name].length).setValues([rowArr_(name, obj)]);
}

function writeAll_(name, objs) {
  // rewrite whole table body (used for bulk updates)
  var sh = sheet_(name);
  var last = sh.getLastRow();
  var n = TABS[name].length;
  if (last > 1) sh.getRange(2, 1, last - 1, n).clearContent();
  if (objs.length) sh.getRange(2, 1, objs.length, n).setValues(objs.map(function (o) { return rowArr_(name, o); }));
}

function deleteRows_(name, rows) {
  var sh = sheet_(name);
  rows.sort(function (a, b) { return b - a; }).forEach(function (r) { sh.deleteRow(r); });
}

function settings_() {
  var s = {};
  readTable_('Settings').forEach(function (r) { s[r.Key] = String(r.Value); });
  return s;
}

function log_(user, action, details) {
  try { appendObj_('Log', { Timestamp: now_(), User: user ? user.name : 'Public', Action: action, Details: details || '' }); } catch (e) {}
}

function tz_() { return Session.getScriptTimeZone() || 'Asia/Kolkata'; }
function fmtDate_(d, f) { return Utilities.formatDate(d, tz_(), f); }
function now_() { return fmtDate_(new Date(), 'yyyy-MM-dd HH:mm'); }
function id_(prefix) { return prefix + Utilities.getUuid().replace(/-/g, '').slice(0, 8).toUpperCase(); }
function phone_(p) { var d = String(p || '').replace(/\D/g, ''); return d.length > 10 ? d.slice(-10) : d; }
function str_(v) { return String(v === null || v === undefined ? '' : v).trim(); }
function num_(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
function yes_(v) { return /^(y|yes|true|1)$/i.test(str_(v)); }

/* ======================= AUTH ======================= */

function login_(name, pin) {
  var users = readTable_('Users').filter(function (u) {
    return str_(u.Name).toLowerCase() === str_(name).toLowerCase() && str_(u.PIN) === str_(pin) && yes_(u.Active);
  });
  if (!users.length) throw new Error('Wrong name or PIN.');
  var u = users[0];
  var role = ['Admin', 'Organiser', 'Scorer'].indexOf(str_(u.Role)) >= 0 ? str_(u.Role) : 'Scorer';
  var token = Utilities.getUuid();
  CacheService.getScriptCache().put('tok_' + token, JSON.stringify({ name: str_(u.Name), role: role }), SESSION_HOURS * 3600);
  log_({ name: str_(u.Name) }, 'login', role);
  return { token: token, name: str_(u.Name), role: role };
}

function checkToken_(token) {
  if (!token) return null;
  var v = CacheService.getScriptCache().get('tok_' + token);
  return v ? JSON.parse(v) : null;
}

/* ======================= READ MODELS ======================= */

function entryName_(e) {
  if (!e) return '';
  return str_(e.Player2) ? str_(e.Player1) + ' / ' + str_(e.Player2) : str_(e.Player1);
}

function entryTower_(e) {
  if (!e) return '';
  var t = [str_(e.P1Tower)];
  if (str_(e.Player2) && str_(e.P2Tower) && str_(e.P2Tower) !== str_(e.P1Tower)) t.push(str_(e.P2Tower));
  return t.filter(String).join(' / ');
}

function publicEntry_(e) {
  return { id: e.EntryID, cat: e.CategoryID, name: entryName_(e), tower: entryTower_(e), seed: e.Seed, group: e.Group };
}

function cleanMatch_(m) {
  var o = {}; TABS.Matches.forEach(function (h) { o[h] = m[h]; }); return o;
}

function publicSettings_(s) {
  return {
    TournamentName: s.TournamentName, Tagline: s.Tagline, Venue: s.Venue, Dates: s.Dates, About: s.About,
    RegistrationOpen: yes_(s.RegistrationOpen), MaxCategoriesPerPlayer: num_(s.MaxCategoriesPerPlayer) || 99,
    UPIId: s.UPIId, UPIName: s.UPIName, PaymentNote: s.PaymentNote, ContactName: s.ContactName,
    ContactPhone: s.ContactPhone, Rules: s.Rules
  };
}

function publicData_() {
  var s = settings_();
  var cats = readTable_('Categories').map(cleanCat_);
  var entries = readTable_('Entries');
  var counts = {};
  entries.forEach(function (e) { if (str_(e.Status) !== 'Withdrawn') counts[e.CategoryID] = (counts[e.CategoryID] || 0) + 1; });
  cats.forEach(function (c) { c.Entries = counts[c.CategoryID] || 0; });
  var approved = entries.filter(function (e) { return e.PaymentStatus === 'Approved' && str_(e.Status) !== 'Withdrawn'; });
  return {
    settings: publicSettings_(s),
    categories: cats,
    entries: approved.map(publicEntry_),
    matches: readTable_('Matches').map(cleanMatch_)
  };
}

function cleanCat_(c) { var o = {}; TABS.Categories.forEach(function (h) { o[h] = c[h]; }); return o; }

function cleanEntry_(e) { var o = {}; TABS.Entries.forEach(function (h) { o[h] = e[h]; }); return o; }

function lookup_(phone) {
  var ph = phone_(phone);
  if (ph.length < 10) throw new Error('Enter your 10-digit mobile number.');
  var mine = readTable_('Entries').filter(function (e) { return phone_(e.P1Phone) === ph || phone_(e.P2Phone) === ph; });
  return {
    entries: mine.map(function (e) {
      return { id: e.EntryID, reg: e.RegID, cat: e.CategoryID, name: entryName_(e), fee: e.Fee, mode: e.PaymentMode,
               payment: e.PaymentStatus, status: e.Status || 'Active', time: e.Timestamp };
    })
  };
}

function scorerData_() {
  var entries = readTable_('Entries');
  return {
    settings: publicSettings_(settings_()),
    categories: readTable_('Categories').map(cleanCat_),
    entries: entries.map(publicEntry_),
    matches: readTable_('Matches').map(cleanMatch_)
  };
}

function adminData_(u) {
  var s = settings_();
  return {
    me: u,
    settingsRaw: readTable_('Settings').map(function (r) { return { Key: r.Key, Value: String(r.Value), Notes: r.Notes }; }),
    settings: publicSettings_(s),
    play: { PlayDays: s.PlayDays, Courts: num_(s.Courts) || 1, DefaultSlotMinutes: num_(s.DefaultSlotMinutes) || 40, RestMinutes: num_(s.RestMinutes) },
    heads: { income: splitList_(s.IncomeHeads), expense: splitList_(s.ExpenseHeads) },
    categories: readTable_('Categories').map(cleanCat_),
    entries: readTable_('Entries').map(cleanEntry_),
    matches: readTable_('Matches').map(cleanMatch_),
    accounts: readTable_('Accounts').map(function (t) { var o = {}; TABS.Accounts.forEach(function (h) { o[h] = t[h]; }); return o; }),
    users: u.role === 'Admin' ? readTable_('Users').map(function (x) { return { Name: x.Name, Role: x.Role, PIN: x.PIN, Active: x.Active }; }) : [],
    sheetUrl: ss_().getUrl(),
    sheetId: ss_().getId()
  };
}

function splitList_(s) { return str_(s).split(',').map(function (x) { return x.trim(); }).filter(String); }

/* ======================= REGISTRATION ======================= */

function register_(p) {
  var s = settings_();
  if (!yes_(s.RegistrationOpen)) throw new Error('Registrations are closed.');
  return createEntries_(p, null);
}

function createEntries_(p, user) {
  var s = settings_();
  var p1 = p.player || {};
  if (!str_(p1.name)) throw new Error('Please enter your name.');
  var ph1 = phone_(p1.phone);
  if (ph1.length !== 10) throw new Error('Please enter a valid 10-digit mobile number.');
  if (!str_(p1.tower)) throw new Error('Please select your tower.');
  var picks = p.categories || [];
  if (!picks.length) throw new Error('Please choose at least one category.');

  var cats = {};
  readTable_('Categories').forEach(function (c) { cats[c.CategoryID] = c; });
  var entries = readTable_('Entries').filter(function (e) { return str_(e.Status) !== 'Withdrawn'; });
  var maxCats = num_(s.MaxCategoriesPerPlayer) || 99;

  var existingForPhone = function (ph) {
    return entries.filter(function (e) { return phone_(e.P1Phone) === ph || phone_(e.P2Phone) === ph; });
  };
  if (!user && existingForPhone(ph1).length + picks.length > maxCats) {
    throw new Error('Each player can enter at most ' + maxCats + ' categories. You already have ' + existingForPhone(ph1).length + '.');
  }

  var regId = id_('R');
  var ts = now_();
  var rows = [];
  var total = 0;
  var seen = {};
  picks.forEach(function (pk) {
    var c = cats[pk.catId];
    if (!c) throw new Error('Unknown category.');
    if (seen[pk.catId]) throw new Error('Category chosen twice: ' + c.Name);
    seen[pk.catId] = true;
    if (!user && str_(c.Status) !== 'Open') throw new Error(c.Name + ' is closed for entries.');
    var inCat = entries.filter(function (e) { return e.CategoryID === c.CategoryID; });
    var max = num_(c.MaxEntries);
    if (max && inCat.length >= max && !user) throw new Error(c.Name + ' is full (' + max + ' entries).');
    var dup = inCat.filter(function (e) { return phone_(e.P1Phone) === ph1 || phone_(e.P2Phone) === ph1; });
    if (dup.length) throw new Error('You are already entered in ' + c.Name + ' (' + entryName_(dup[0]) + ').');
    var partner = pk.partner || {};
    var ph2 = '';
    if (str_(c.Type) === 'Doubles') {
      if (!str_(partner.name)) throw new Error('Please enter your partner\'s name for ' + c.Name + '.');
      ph2 = phone_(partner.phone);
      if (ph2 && ph2.length !== 10) throw new Error('Partner\'s mobile number for ' + c.Name + ' looks wrong.');
      if (ph2 && ph2 === ph1) throw new Error('Partner\'s number cannot be the same as yours.');
      if (ph2) {
        var dup2 = inCat.filter(function (e) { return phone_(e.P1Phone) === ph2 || phone_(e.P2Phone) === ph2; });
        if (dup2.length) throw new Error(str_(partner.name) + ' is already entered in ' + c.Name + ' (' + entryName_(dup2[0]) + ').');
      }
    }
    var fee = num_(c.Fee);
    total += fee;
    rows.push({
      EntryID: id_('E'), RegID: regId, Timestamp: ts, CategoryID: c.CategoryID,
      Player1: str_(p1.name), P1Tower: str_(p1.tower), P1Flat: str_(p1.flat), P1Phone: ph1,
      Player2: str_(c.Type) === 'Doubles' ? str_(partner.name) : '',
      P2Tower: str_(c.Type) === 'Doubles' ? str_(partner.tower) : '',
      P2Flat: str_(c.Type) === 'Doubles' ? str_(partner.flat) : '',
      P2Phone: ph2,
      LastTournament: str_(p.last && p.last.tournament), LastCategory: str_(p.last && p.last.category),
      LastResult: str_(p.last && p.last.result),
      Fee: fee, PaymentMode: p.paymentMode === 'Cash' ? 'Cash' : 'UPI', PaymentRef: str_(p.paymentRef),
      ScreenshotID: '', PaymentStatus: 'Pending', ApprovedBy: '', ApprovedAt: '', Seed: '', Group: '',
      Status: 'Active', Remarks: str_(p.remarks)
    });
  });

  if (p.paymentMode !== 'Cash' && !user) {
    if (!p.screenshot || !p.screenshot.data) throw new Error('Please upload the payment screenshot (or choose Cash).');
  }
  var shotId = '';
  if (p.screenshot && p.screenshot.data) {
    var bytes = Utilities.base64Decode(String(p.screenshot.data).replace(/^data:[^,]+,/, ''));
    if (bytes.length > 4 * 1024 * 1024) throw new Error('Screenshot is too large (max 4 MB).');
    var blob = Utilities.newBlob(bytes, p.screenshot.mime || 'image/jpeg', regId + '_' + str_(p1.name).replace(/\W+/g, '_') + '.jpg');
    shotId = screenshotFolder_().createFile(blob).getId();
  }
  rows.forEach(function (r) {
    r.ScreenshotID = shotId;
    if (user && p.approveNow) { r.PaymentStatus = 'Approved'; r.ApprovedBy = user.name; r.ApprovedAt = ts; }
  });
  appendMany_('Entries', rows);
  log_(user, 'register', regId + ' ' + str_(p1.name) + ' ' + rows.map(function (r) { return r.CategoryID; }).join(','));
  return { regId: regId, total: total, count: rows.length };
}

function screenshotFolder_() {

/* ======================= DRAWS ======================= */

function bracketOrder_(size) {
  var order = [1, 2];
  while (order.length < size) {
    var n = order.length * 2, next = [];
    order.forEach(function (s) { next.push(s); next.push(n + 1 - s); });
    order = next;
  }
  return order;
}

function koRoundName_(matchesInRound) {
  if (matchesInRound === 1) return 'Final';
  if (matchesInRound === 2) return 'Semi-final';
  if (matchesInRound === 4) return 'Quarter-final';
  return 'Round of ' + (matchesInRound * 2);
}

function shuffle_(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function orderedEntries_(list) {
  var seeded = list.filter(function (e) { return str_(e.Seed) !== '' && num_(e.Seed) > 0; })
                   .sort(function (a, b) { return num_(a.Seed) - num_(b.Seed); });
  var unseeded = shuffle_(list.filter(function (e) { return !(str_(e.Seed) !== '' && num_(e.Seed) > 0); }));
  return seeded.concat(unseeded);
}

function generateDraw_(p, u) {
  var cat = readTable_('Categories').filter(function (c) { return c.CategoryID === p.CategoryID; })[0];
  if (!cat) throw new Error('Category not found');
  var existing = readTable_('Matches').filter(function (m) { return m.CategoryID === cat.CategoryID; });
  if (existing.length) throw new Error('A draw already exists for ' + cat.Name + '. Clear it first.');
  var list = readTable_('Entries').filter(function (e) {
    return e.CategoryID === cat.CategoryID && e.PaymentStatus === 'Approved' && str_(e.Status) !== 'Withdrawn';
  });
  if (list.length < 2) throw new Error('Need at least 2 approved entries in ' + cat.Name + ' (found ' + list.length + ').');
  var ordered = orderedEntries_(list);
  var format = p.Format || cat.Format;
  var offset = maxMatchNo_();   // match numbers are unique across the whole tournament
  var matches = format === 'Round Robin' ? buildRR_(cat, ordered, num_(p.Groups) || num_(cat.Groups) || 1, offset)
                                         : buildKO_(cat, ordered, offset);
  appendMany_('Matches', matches);
  log_(u, 'generate draw', cat.CategoryID + ' ' + format + ' ' + list.length + ' entries, ' + matches.length + ' matches');
  return { matches: matches.length, entries: list.length };
}

function maxMatchNo_() {
  return readTable_('Matches').reduce(function (mx, m) { return Math.max(mx, num_(m.MatchNo)); }, 0);
}

function buildKO_(cat, ordered, offset) {
  var n = ordered.length;
  var size = 1; while (size < n) size *= 2;
  var order = bracketOrder_(size);
  var slots = order.map(function (seedNo) { return seedNo <= n ? ordered[seedNo - 1].EntryID : 'BYE'; });
  var rounds = Math.log(size) / Math.LN2;
  var all = [], byRound = [], no = offset || 0;
  for (var r = 1; r <= rounds; r++) {
    var count = size / Math.pow(2, r), arr = [];
    for (var k = 1; k <= count; k++) {
      no++;
      arr.push({
        MatchID: cat.CategoryID + '-R' + r + '-' + k, CategoryID: cat.CategoryID, Stage: 'KO',
        Round: koRoundName_(count), RoundNo: r, Group: '', MatchNo: no, SideA: '', SideB: '',
        NextMatch: r < rounds ? cat.CategoryID + '-R' + (r + 1) + '-' + Math.ceil(k / 2) : '',
        NextSlot: r < rounds ? (k % 2 === 1 ? 'A' : 'B') : '',
        Date: '', Time: '', Court: '', Score: '', Winner: '', Result: 'Pending', EnteredBy: '', EnteredAt: '', Notes: ''
      });
    }
    byRound.push(arr); all = all.concat(arr);
  }
  var index = {}; all.forEach(function (m) { index[m.MatchID] = m; });
  byRound[0].forEach(function (m, i) { m.SideA = slots[2 * i]; m.SideB = slots[2 * i + 1]; });
  byRound[0].forEach(function (m) {
    if (m.SideA === 'BYE' || m.SideB === 'BYE') {
      m.Winner = m.SideA === 'BYE' ? m.SideB : m.SideA;
      m.Result = 'Bye'; m.Score = 'Bye';
      advance_(index, m);
    }
  });
  return all;
}

function advance_(index, m) {
  if (!m.NextMatch) return;
  var nx = index[m.NextMatch];
  if (!nx) return;
  if (m.NextSlot === 'A') nx.SideA = m.Winner || ''; else nx.SideB = m.Winner || '';
}

function buildRR_(cat, ordered, groups, offset) {
  groups = Math.max(1, Math.min(groups, Math.floor(ordered.length / 2)));
  var buckets = []; for (var g = 0; g < groups; g++) buckets.push([]);
  ordered.forEach(function (e, i) {               // snake seeding
    var row = Math.floor(i / groups), pos = i % groups;
    buckets[row % 2 === 0 ? pos : groups - 1 - pos].push(e.EntryID);
  });
  var letters = 'ABCDEFGHIJ';
  var all = [], no = offset || 0;
  buckets.forEach(function (ids, gi) {
    var gname = groups > 1 ? letters.charAt(gi) : '';
    var list = ids.slice(); if (list.length % 2) list.push('BYE');
    var n = list.length;
    for (var r = 0; r < n - 1; r++) {
      for (var i = 0; i < n / 2; i++) {
        var a = list[i], b = list[n - 1 - i];
        if (a === 'BYE' || b === 'BYE') continue;
        no++;
        all.push({
          MatchID: cat.CategoryID + '-' + (gname || 'G') + '-' + (r + 1) + '-' + (i + 1), CategoryID: cat.CategoryID, Stage: 'RR',
          Round: (gname ? 'Group ' + gname + ' · ' : '') + 'Round ' + (r + 1), RoundNo: r + 1, Group: gname, MatchNo: no,
          SideA: a, SideB: b, NextMatch: '', NextSlot: '', Date: '', Time: '', Court: '', Score: '', Winner: '',
          Result: 'Pending', EnteredBy: '', EnteredAt: '', Notes: ''
        });
      }
      list.splice(1, 0, list.pop());               // circle method
    }
  });
  // record group on entries
  var eRows = readTable_('Entries');
  buckets.forEach(function (ids, gi) {
    ids.forEach(function (id) {
      var e = eRows.filter(function (x) { return x.EntryID === id; })[0];
      if (e) { e.Group = groups > 1 ? letters.charAt(gi) : ''; updateObj_('Entries', e); }
    });
  });
  return all;
}

function clearDraw_(p, u) {
  var ms = readTable_('Matches').filter(function (m) { return m.CategoryID === p.CategoryID; });
  var played = ms.filter(function (m) { return m.Result !== 'Pending' && m.Result !== 'Bye'; });
  if (played.length && !p.force) throw new Error(played.length + ' match(es) already have results. Tick "force" to clear anyway.');
  deleteRows_('Matches', ms.map(function (m) { return m._row; }));
  log_(u, 'clear draw', p.CategoryID + ' (' + ms.length + ' matches)');
  return ms.length;
}

/* ======================= SCORES ======================= */

function saveScore_(p, u) {
  var all = readTable_('Matches');
  var index = {}; all.forEach(function (m) { index[m.MatchID] = m; });
  var m = index[p.MatchID];
  if (!m) throw new Error('Match not found');
  if (!m.SideA || !m.SideB || m.SideA === 'BYE' || m.SideB === 'BYE') throw new Error('Both players are not known yet for this match.');
  var result = ['Completed', 'Walkover', 'Retired'].indexOf(p.Result) >= 0 ? p.Result : 'Completed';
  var winner = p.Winner === 'A' ? m.SideA : p.Winner === 'B' ? m.SideB : '';
  if (!winner) throw new Error('Please choose the winner.');
  var score = str_(p.Score);
  if (result === 'Walkover' && !score) score = 'W/O';
  if (!score) throw new Error('Please enter the score (e.g. 4-1, 6-4 3-6 10-7).');
  var oldWinner = m.Winner;
  if (m.NextMatch && oldWinner && oldWinner !== winner) {
    var nx = index[m.NextMatch];
    if (nx && nx.Result !== 'Pending') throw new Error('The next-round match is already played. Clear that score first.');
  }
  m.Winner = winner; m.Score = score; m.Result = result;
  m.EnteredBy = u.name; m.EnteredAt = now_();
  if (p.Notes !== undefined) m.Notes = str_(p.Notes);
  updateObj_('Matches', m);
  if (m.NextMatch && index[m.NextMatch]) {
    advance_(index, m);
    updateObj_('Matches', index[m.NextMatch]);
  }
  log_(u, 'score', m.MatchID + ' ' + score + ' winner ' + winner);
  return true;
}

function clearScore_(p, u) {
  var all = readTable_('Matches');
  var index = {}; all.forEach(function (m) { index[m.MatchID] = m; });
  var m = index[p.MatchID];
  if (!m) throw new Error('Match not found');
  if (m.NextMatch && index[m.NextMatch]) {
    var nx = index[m.NextMatch];
    if (nx.Result !== 'Pending') throw new Error('The next-round match is already played. Clear that score first.');
    if (m.NextSlot === 'A') nx.SideA = ''; else nx.SideB = '';
    updateObj_('Matches', nx);
  }
  m.Winner = ''; m.Score = ''; m.Result = 'Pending'; m.EnteredBy = u.name; m.EnteredAt = now_();
  updateObj_('Matches', m);
  log_(u, 'clear score', m.MatchID);
  return true;
}

function editMatch_(p, u) {
  var m = readTable_('Matches').filter(function (x) { return x.MatchID === p.MatchID; })[0];
  if (!m) throw new Error('Match not found');
  ['Date', 'Time', 'Court', 'Round', 'Notes', 'SideA', 'SideB'].forEach(function (k) { if (p[k] !== undefined) m[k] = str_(p[k]); });
  updateObj_('Matches', m);
  log_(u, 'edit match', m.MatchID);

}

function addMatch_(p, u) {
  if (!p.CategoryID) throw new Error('Choose a category');
  var ms = readTable_('Matches');
  var no = ms.reduce(function (mx, m) { return Math.max(mx, num_(m.MatchNo)); }, 0) + 1;

    Round: str_(p.Round) || 'Play-off', RoundNo: num_(p.RoundNo) || 99, Group: '', MatchNo: no,
    SideA: str_(p.SideA), SideB: str_(p.SideB), NextMatch: '', NextSlot: '', Date: str_(p.Date), Time: str_(p.Time),
    Court: str_(p.Court), Score: '', Winner: '', Result: 'Pending', EnteredBy: '', EnteredAt: '', Notes: str_(p.Notes)
  };
  appendObj_('Matches', o);

  return o.MatchID;

function deleteMatch_(p, u) {
  var all = readTable_('Matches');
  var m = all.filter(function (x) { return x.MatchID === p.MatchID; })[0];
  if (!m) throw new Error('Match not found');
  var feeds = all.some(function (x) { return x.NextMatch === m.MatchID; });
  if (m.Stage === 'KO' || feeds) throw new Error('Knockout matches are linked. Clear the whole draw instead.');
  deleteRows_('Matches', [m._row]);
  log_(u, 'delete match', m.MatchID);

/* ======================= SCHEDULE ======================= */

function parseDays_(text) {
  var days = [];
  str_(text).split(/\n|;/).forEach(function (line) {
    var mm = line.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
    if (mm) days.push({ date: mm[1], start: +mm[2] * 60 + +mm[3], end: +mm[4] * 60 + +mm[5] });
  });
  days.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.start - b.start; });
  return days;
}

function hhmm_(mins) { var h = Math.floor(mins / 60), m = mins % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }

function autoSchedule_(p, u) {
  var s = settings_();
  var days = parseDays_(s.PlayDays);
  if (!days.length) throw new Error('Add play days in Settings (e.g. 2026-11-07 07:00-19:00).');
  var courts = Math.max(1, num_(s.Courts) || 1);
  var defMin = num_(s.DefaultSlotMinutes) || 40;
  var rest = num_(s.RestMinutes);
  var cats = {}; readTable_('Categories').forEach(function (c) { cats[c.CategoryID] = c; });
  var entries = {}; readTable_('Entries').forEach(function (e) { entries[e.EntryID] = e; });
  var all = readTable_('Matches');
  var onlyCats = p.categories && p.categories.length ? p.categories : null;
  var startDay = 0, startMin = days[0].start;
  if (p.fromDate) {
    for (var d0 = 0; d0 < days.length; d0++) if (days[d0].date >= p.fromDate) { startDay = d0; break; }
    startMin = days[startDay].start;
    if (p.fromTime && days[startDay].date === p.fromDate) {
      var t = p.fromTime.split(':'); startMin = Math.max(days[startDay].start, +t[0] * 60 + +t[1]);
    }
  }
  var abs = function (dayIdx, min) { return dayIdx * 1440 + min; };
  var dur = function (m) { return num_(cats[m.CategoryID] && cats[m.CategoryID].SlotMinutes) || defMin; };
  var phones = function (sideId) {
    var e = entries[sideId]; if (!e) return [];
    return [phone_(e.P1Phone), phone_(e.P2Phone)].filter(String);
  };
  var feeders = {}; all.forEach(function (m) { if (m.NextMatch) (feeders[m.NextMatch] = feeders[m.NextMatch] || []).push(m); });

  var todo = all.filter(function (m) {
    return m.Result === 'Pending' && (!onlyCats || onlyCats.indexOf(m.CategoryID) >= 0) &&
           !(p.keepManual && m.Date);
  });
  var todoIds = {}; todo.forEach(function (m) { todoIds[m.MatchID] = true; });
  var finishAt = {};   // MatchID -> abs end time (for scheduled / fixed matches)
  var playerFree = {}; // phone -> abs time free
  // fixed matches (already scheduled and not being moved) block the court and players
  var courtBusy = [];  // {court, s, e}
  all.forEach(function (m) {
    if (todoIds[m.MatchID] || !m.Date || !m.Time) return;
    var di = -1; days.forEach(function (d, i) { if (d.date === m.Date && di < 0) di = i; });
    if (di < 0) return;
    var tt = String(m.Time).split(':'); var st = abs(di, +tt[0] * 60 + +tt[1]); var en = st + dur(m);
    finishAt[m.MatchID] = en;
    if (m.Result === 'Pending') courtBusy.push({ court: str_(m.Court) || '1', s: st, e: en });
    phones(m.SideA).concat(phones(m.SideB)).forEach(function (ph) { playerFree[ph] = Math.max(playerFree[ph] || 0, en + rest); });
  });
  all.forEach(function (m) { if (m.Result === 'Bye') finishAt[m.MatchID] = -1; });

  var catOrder = function (id) { return num_(cats[id] && cats[id].Order) || 99; };
  var prio = function (m) { return m.Round === 'Final' ? 2 : m.Round === 'Semi-final' ? 1 : 0; };
  todo.sort(function (a, b) {
    return prio(a) - prio(b) || num_(a.RoundNo) - num_(b.RoundNo) || catOrder(a.CategoryID) - catOrder(b.CategoryID) ||
           num_(a.MatchNo) - num_(b.MatchNo);
  });

<main id="app"><div class="loading">Loading…</div></main>
<div class="foot" id="foot"></div>
<div id="print"></div>
<div id="toast"></div>

<script>
/* ===================== STATE & API ===================== */
var S = { view:'home', token:'', me:null, pub:null, adm:null, sc:null, f:{} };
try { var saved = JSON.parse(sessionStorage.getItem('auris_sess') || 'null'); if (saved) { S.token = saved.token; S.me = saved.me; } } catch (e) {}

function call(action, payload) {
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (s) { var r = JSON.parse(s); if (r.ok) res(r.data); else rej(new Error(r.error)); })
      .withFailureHandler(function (e) { rej(e instanceof Error ? e : new Error(String(e && e.message || e))); })
      .api(action, JSON.stringify(payload || {}), S.token || '');
  });
}
function saveSess() { try { sessionStorage.setItem('auris_sess', JSON.stringify(S.token ? { token: S.token, me: S.me } : null)); } catch (e) {} }

/* ===================== UTILITIES ===================== */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function $(id) { return document.getElementById(id); }
function val(id) { var el = $(id); return el ? el.value.trim() : ''; }
function toast(msg, bad) { var t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, bad ? 5000 : 2800); }
function fail(e) { toast(e.message || String(e), true); }
function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn._t = btn.innerHTML; btn.innerHTML = 'Please wait…'; } else if (btn._t) btn.innerHTML = btn._t; }
function dayLabel(d) { if (!d) return 'Not scheduled'; var x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); }
function shortDay(d) { if (!d) return ''; var x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function role() { return S.me ? S.me.role : ''; }
function isStaff() { return role() === 'Admin' || role() === 'Organiser'; }
function modal(html) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="sheet"><button class="x" onclick="closeModal()" aria-label="Close">×</button>' + html + '</div>'; m.addEventListener('click', function (e) { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal() { document.querySelectorAll('.modal').forEach(function (m) { m.remove(); }); }

/* data source for the current viewer */
function D() { return isStaff() ? S.adm : role() === 'Scorer' ? S.sc : S.pub; }
function catMap() { var m = {}; (D().categories || []).forEach(function (c) { m[c.CategoryID] = c; }); return m; }
function entMap() {
  var m = {}; var d = D();
  (d.entries || []).forEach(function (e) {
    if (e.EntryID) m[e.EntryID] = { id: e.EntryID, name: e.Player2 ? e.Player1 + ' / ' + e.Player2 : e.Player1, tower: [e.P1Tower, e.Player2 && e.P2Tower !== e.P1Tower ? e.P2Tower : ''].filter(Boolean).join(' / '), raw: e };
    else m[e.id] = e;
  });
  return m;
}
function feederMap() { var f = {}; (D().matches || []).forEach(function (m) { if (m.NextMatch) f[m.NextMatch + m.NextSlot] = m; }); return f; }
function sideName(m, slot, E, F) {
  var id = slot === 'A' ? m.SideA : m.SideB;
  if (id === 'BYE') return 'Bye';
  if (id && E[id]) return E[id].name;
  var fd = F && F[m.MatchID + slot];
  return fd ? 'Winner of M' + fd.MatchNo : 'TBD';
}
function sideTower(m, slot, E) { var id = slot === 'A' ? m.SideA : m.SideB; return id && E[id] ? E[id].tower : ''; }
function sortMatches(ms) {
  return ms.slice().sort(function (a, b) {
    var ka = (a.Date || '9999') + ' ' + (a.Time || '99:99') + ' ' + (a.Court || ''), kb = (b.Date || '9999') + ' ' + (b.Time || '99:99') + ' ' + (b.Court || '');
    return ka < kb ? -1 : ka > kb ? 1 : (a.CategoryID < b.CategoryID ? -1 : a.CategoryID > b.CategoryID ? 1 : Number(a.MatchNo) - Number(b.MatchNo));
  });
}
function resultBadge(m) {
  if (m.Result === 'Completed') return '<span class="badge ok">Done</span>';
  if (m.Result === 'Walkover') return '<span class="badge warn">W/O</span>';
  if (m.Result === 'Retired') return '<span class="badge warn">Ret.</span>';
  if (m.Result === 'Bye') return '<span class="badge">Bye</span>';
  return '';
}
function parseGames(score) {
  var s = String(score || '').replace(/\(\d+\)/g, ''); var re = /(\d+)\s*[-–]\s*(\d+)/g, r, w = 0, l = 0;
  while ((r = re.exec(s))) { w += +r[1]; l += +r[2]; }
  return { w: w, l: l };
}

/* ===================== NAVIGATION ===================== */
var NAVS = {
  Public: [['home', 'Home'], ['register', 'Register'], ['draws', 'Draws'], ['schedule', 'Matches & Results'], ['mine', 'My Entries'], ['login', 'Staff login']],
  Scorer: [['scores', 'Enter Scores'], ['draws', 'Draws'], ['schedule', 'Matches'], ['print', 'Print'], ['logout', 'Log out']],
  Organiser: [['dash', 'Dashboard'], ['entries', 'Entries'], ['cats', 'Categories'], ['drawadmin', 'Draws'], ['sched', 'Schedule'], ['scores', 'Scores'], ['accounts', 'Accounts'], ['print', 'Print'], ['export', 'Export'], ['logout', 'Log out']],
  Admin: [['dash', 'Dashboard'], ['entries', 'Entries'], ['cats', 'Categories'], ['drawadmin', 'Draws'], ['sched', 'Schedule'], ['scores', 'Scores'], ['accounts', 'Accounts'], ['print', 'Print'], ['export', 'Export'], ['settings', 'Settings'], ['users', 'Users'], ['logout', 'Log out']]
};
function renderNav() {
  var items = NAVS[role() || 'Public'];
  $('nav').innerHTML = items.map(function (i) { return '<button class="' + (S.view === i[0] ? 'on' : '') + '" onclick="go(\'' + i[0] + '\')">' + i[1] + '</button>'; }).join('');
  var on = document.querySelector('nav button.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  var w = $('who');
  if (S.me) { w.style.display = ''; w.textContent = S.me.name + ' · ' + S.me.role; } else w.style.display = 'none';
}
function go(v) {
  if (v === 'logout') { S.token = ''; S.me = null; S.adm = null; S.sc = null; saveSess(); S.view = 'home'; return boot(); }
  S.view = v; renderNav(); render(); window.scrollTo(0, 0);
}
function render() {
  var fn = VIEWS[S.view] || VIEWS.home;
  try { $('app').innerHTML = fn(); if (fn.after) fn.after(); } catch (e) { $('app').innerHTML = '<div class="card">Something went wrong: ' + esc(e.message) + '</div>'; console.error(e); }
}
function boot() {
  $('app').innerHTML = '<div class="loading">Loading…</div>';
  var p;
  if (isStaff()) p = call('getAdmin').then(function (d) { S.adm = d; });
  else if (role() === 'Scorer') p = call('getScorer').then(function (d) { S.sc = d; });
  else p = call('getPublic').then(function (d) { S.pub = d; });
  return p.then(function () {
    var st = D().settings || {};
    $('tName').innerHTML = esc(st.TournamentName || 'Auris Open') + '<small>' + esc(st.Tagline || '') + '</small>';
    document.title = st.TournamentName || 'Auris Open';
    $('foot').textContent = (st.Venue || '') + (st.ContactName ? ' · Contact: ' + st.ContactName + ' ' + (st.ContactPhone || '') : '');
    if (S.me && NAVS[role()].map(function (x) { return x[0]; }).indexOf(S.view) < 0) S.view = NAVS[role()][0][0];
    renderNav(); render();
  }).catch(function (e) {
    if (/Session expired/.test(e.message)) { S.token = ''; S.me = null; saveSess(); return boot(); }
    $('app').innerHTML = '<div class="card">Could not load: ' + esc(e.message) + '</div>';
  });
}
function reload() { return boot(); }

/* ===================== VIEWS ===================== */
var VIEWS = {};

/* ---------- HOME ---------- */
VIEWS.home = function () {
  var d = S.pub, s = d.settings;
  var cats = d.categories.slice().sort(function (a, b) { return a.Order - b.Order; });
  return '<div class="card"><h2>' + esc(s.TournamentName) + '</h2><p>' + esc(s.About) + '</p>' +
    '<div class="grid2"><div><span class="muted small">Dates</span><br><b>' + esc(s.Dates) + '</b></div><div><span class="muted small">Venue</span><br><b>' + esc(s.Venue) + '</b></div></div>' +
    '<div class="row" style="margin-top:14px">' + (s.RegistrationOpen ? '<button class="btn pri" onclick="go(\'register\')">Register now</button>' : '<span class="badge bad">Registrations closed</span>') +
    '<button class="btn" onclick="go(\'draws\')">View draws</button><button class="btn" onclick="go(\'mine\')">My entries</button></div></div>' +
    '<div class="card"><h2>Categories</h2><div class="tablewrap"><table><tr><th>Category</th><th>Format</th><th class="num">Fee</th><th class="num">Entries</th><th></th></tr>' +
    cats.map(function (c) {
      return '<tr><td><b>' + esc(c.Name) + '</b><br><span class="muted small">' + esc(c.Type) + (c.Notes ? ' · ' + esc(c.Notes) : '') + '</span></td><td>' + esc(c.Format) + '</td><td class="num">' + money(c.Fee) +
        '</td><td class="num">' + c.Entries + (c.MaxEntries ? '/' + c.MaxEntries : '') + '</td><td>' + (c.Status === 'Open' ? '<span class="badge ok">Open</span>' : '<span class="badge">Closed</span>') + '</td></tr>';
    }).join('') + '</table></div></div>' +
    (s.Rules ? '<div class="card"><h2>Rules</h2><div class="rules small">' + esc(s.Rules) + '</div></div>' : '');
};

/* ---------- REGISTER (also used by admin "add entry") ---------- */
S.reg = { cats: {}, mode: 'UPI', shot: null };
function regForm(adminMode) {
  var d = D(), s = d.settings;
  var cats = d.categories.filter(function (c) { return adminMode || c.Status === 'Open'; }).sort(function (a, b) { return a.Order - b.Order; });
  var towers = ['Tower 1', 'Tower 2', 'Tower 3', 'Guest'];
  var tSel = function (id) { return '<select id="' + id + '"><option value="">Select</option>' + towers.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select>'; };
  return '<h3>Your details</h3><div class="grid2"><div><label>Full name *</label><input id="r_name" autocomplete="name"></div>' +
    '<div><label>Mobile number *</label><input id="r_phone" inputmode="tel" placeholder="10-digit mobile"></div>' +
    '<div><label>Tower *</label>' + tSel('r_tower') + '</div><div><label>Flat no.</label><input id="r_flat"></div></div>' +
    '<h3>Categories</h3><p class="muted small">You can enter up to ' + (s.MaxCategoriesPerPlayer || '') + ' categories.</p>' +
    cats.map(function (c) {
      return '<div class="cat-pick" id="cp_' + c.CategoryID + '"><div class="top"><label style="margin:0;color:var(--ink);font-size:15px;display:flex;align-items:center"><input type="checkbox" onchange="regPick(\'' + c.CategoryID + '\',this.checked)">' + esc(c.Name) + '</label><b>' + money(c.Fee) + '</b></div>' +
        (c.Type === 'Doubles' ? '<div id="pt_' + c.CategoryID + '" style="display:none"><div class="grid2"><div><label>Partner\'s name *</label><input id="pn_' + c.CategoryID + '"></div><div><label>Partner\'s mobile</label><input id="pp_' + c.CategoryID + '" inputmode="tel"></div><div><label>Partner\'s tower</label>' + tSel('pw_' + c.CategoryID) + '</div><div><label>Partner\'s flat</label><input id="pf_' + c.CategoryID + '"></div></div><p class="muted small" style="margin:6px 0 0">Only one of you needs to register the pair.</p></div>' : '') +
        '</div>';
    }).join('') +
    '<h3>Playing history <span class="muted small">(helps the organisers with seeding)</span></h3><div class="grid2">' +
    '<div><label>Last tournament played</label><input id="r_lt" placeholder="e.g. Auris Open 2025"></div>' +
    '<div><label>Category played</label><input id="r_lc" placeholder="e.g. Men\'s Singles"></div>' +
    '<div><label>Last result</label><select id="r_lr"><option value="">Select</option><option>Winner</option><option>Runner-up</option><option>Semi-final</option><option>Quarter-final</option><option>Earlier round</option><option>First tournament</option></select></div>' +
    '<div><label>Anything else?</label><input id="r_rm" placeholder="e.g. not available Sat morning"></div></div>' +
    '<h3>Payment</h3><div class="pay"><div class="row" style="justify-content:space-between"><span>Total to pay</span><b id="r_total" style="font-size:20px">₹0</b></div>' +
    '<div class="radio" style="margin-top:10px"><label id="m_UPI" class="on"><input type="radio" name="pm" checked onchange="regMode(\'UPI\')">UPI</label><label id="m_Cash"><input type="radio" name="pm" onchange="regMode(\'Cash\')">Cash</label></div>' +
    '<div id="upiBox" style="margin-top:12px">' +
    (s.UPIId ? '<div class="qr" id="qr"></div><p class="small" style="text-align:center;margin:8px 0">Scan with any UPI app or pay to <b>' + esc(s.UPIId) + '</b>' + (s.UPIName ? ' (' + esc(s.UPIName) + ')' : '') + '</p><a class="btn block" id="upiLink" href="#">Open UPI app</a>' : '<div class="warnbox">UPI ID not set yet. Please pay the organiser directly.</div>') +
    '<label>Payment screenshot ' + (adminMode ? '' : '*') + '</label><input type="file" id="r_shot" accept="image/*" onchange="regShot(this)"><div id="shotPrev" class="small muted"></div>' +
    '<label>UPI reference / UTR (optional)</label><input id="r_ref" placeholder="12-digit UTR from your UPI app"></div>' +
    '<div id="cashBox" style="display:none;margin-top:10px" class="small">Hand the cash to the organiser. Your entry is confirmed once they mark it as received.</div>' +
    '<p class="small muted" style="margin-bottom:0">' + esc(s.PaymentNote || '') + '</p></div>' +
    (adminMode ? '<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="r_appr" style="width:auto" checked> Payment received – approve now</label>' : '');
}
function regPick(id, on) {
  if (on) S.reg.cats[id] = true; else delete S.reg.cats[id];
  $('cp_' + id).classList.toggle('on', on);
  var pt = $('pt_' + id); if (pt) pt.style.display = on ? '' : 'none';
  regTotal();
}
function regTotal() {
  var cm = catMap(), t = 0; Object.keys(S.reg.cats).forEach(function (k) { t += Number(cm[k].Fee || 0); });
  $('r_total').textContent = money(t);
  var s = D().settings;
  if (s.UPIId && $('qr')) {
    var url = 'upi://pay?pa=' + encodeURIComponent(s.UPIId) + '&pn=' + encodeURIComponent(s.UPIName || 'Auris Open') + (t ? '&am=' + t : '') + '&cu=INR&tn=' + encodeURIComponent(s.TournamentName || 'Auris Open');
    $('upiLink').href = url;
    $('qr').innerHTML = '';
    if (window.QRCode) new QRCode($('qr'), { text: url, width: 190, height: 190 }); else $('qr').innerHTML = '<span class="small muted">QR unavailable – use the UPI ID below</span>';
  }
}
function regMode(m) { S.reg.mode = m; $('m_UPI').classList.toggle('on', m === 'UPI'); $('m_Cash').classList.toggle('on', m === 'Cash'); $('upiBox').style.display = m === 'UPI' ? '' : 'none'; $('cashBox').style.display = m === 'Cash' ? '' : 'none'; }
function regShot(inp) {
  var f = inp.files && inp.files[0]; if (!f) { S.reg.shot = null; return; }
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 1280, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S.reg.shot = { data: c.toDataURL('image/jpeg', 0.75), mime: 'image/jpeg', name: f.name };
      $('shotPrev').innerHTML = '<img src="' + S.reg.shot.data + '" style="max-height:120px;border-radius:8px;margin-top:6px">';
    };
    img.onerror = function () { S.reg.shot = null; toast('Could not read that image. Try a screenshot (JPG/PNG).', true); };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function regPayload() {
  var cm = catMap();
  return {
    player: { name: val('r_name'), phone: val('r_phone'), tower: val('r_tower'), flat: val('r_flat') },
    categories: Object.keys(S.reg.cats).map(function (id) {
      return cm[id].Type === 'Doubles' ? { catId: id, partner: { name: val('pn_' + id), phone: val('pp_' + id), tower: val('pw_' + id), flat: val('pf_' + id) } } : { catId: id };
    }),
    last: { tournament: val('r_lt'), category: val('r_lc'), result: val('r_lr') },
    remarks: val('r_rm'), paymentMode: S.reg.mode, paymentRef: val('r_ref'),
    screenshot: S.reg.mode === 'UPI' ? S.reg.shot : null
  };
}
VIEWS.register = function () {
  S.reg = { cats: {}, mode: 'UPI', shot: null };
  var s = S.pub.settings;
  if (!s.RegistrationOpen) return '<div class="card"><h2>Registrations are closed</h2><p class="muted">Please contact the organisers.</p></div>';
  return '<div class="card"><h2>Register for ' + esc(s.TournamentName) + '</h2>' + regForm(false) +
    '<button class="btn pri block" style="margin-top:16px" onclick="regSubmit(this)">Submit registration</button></div>';
};
VIEWS.register.after = function () { regTotal(); };
function regSubmit(btn) {
  var p = regPayload();
  if (!p.categories.length) return toast('Choose at least one category.', true);
  busy(btn, true);
  call('register', p).then(function (r) {
    $('app').innerHTML = '<div class="card"><h2>Registration received</h2><div class="okbox">Reference <b>' + esc(r.regId) + '</b> · ' + r.count + ' categor' + (r.count > 1 ? 'ies' : 'y') + ' · ' + money(r.total) + '</div>' +
      '<p>Your payment is <span class="badge warn">Pending</span> until the organiser approves it. Check the status any time under <b>My Entries</b> with your mobile number.</p>' +
      '<div class="row"><button class="btn pri" onclick="S.f.phone=\'' + esc(p.player.phone) + '\';go(\'mine\')">My entries</button><button class="btn" onclick="reload().then(function(){go(\'home\')})">Home</button></div></div>';
  }).catch(function (e) { busy(btn, false); fail(e); });
}

/* ---------- DRAWS ---------- */
function drawHtml(catId) {
  var d = D(), E = entMap(), F = feederMap(), cm = catMap(), c = cm[catId];
  var ms = d.matches.filter(function (m) { return m.CategoryID === catId; });
  if (!ms.length) return '<div class="empty">Draw not published yet.</div>';
  var out = '';
  var ko = ms.filter(function (m) { return m.Stage === 'KO'; });
  var rr = ms.filter(function (m) { return m.Stage === 'RR'; });
  var other = ms.filter(function (m) { return m.Stage !== 'KO' && m.Stage !== 'RR'; });
  if (ko.length) {
    var rounds = {}; ko.forEach(function (m) { (rounds[m.RoundNo] = rounds[m.RoundNo] || []).push(m); });
    out += '<div class="bracket">' + Object.keys(rounds).sort(function (a, b) { return a - b; }).map(function (r) {
      var list = rounds[r].sort(function (a, b) { return a.MatchNo - b.MatchNo; });
      return '<div class="bround"><h4>' + esc(list[0].Round) + '</h4><div class="bcol">' + list.map(function (m) {
        var wa = m.Winner && m.Winner === m.SideA, wb = m.Winner && m.Winner === m.SideB;
        return '<div class="bm"><div class="' + (wa ? 'w' : '') + '"><span>' + esc(sideName(m, 'A', E, F)) + '</span>' + seedTag(m.SideA, E) + '</div><div class="' + (wb ? 'w' : '') + '"><span>' + esc(sideName(m, 'B', E, F)) + '</span>' + seedTag(m.SideB, E) + '</div>' +
          (m.Result === 'Bye' ? '' : '<div class="s"><span>M' + m.MatchNo + (m.Date ? ' · ' + shortDay(m.Date) + ' ' + esc(m.Time) : '') + '</span><b>' + esc(m.Score) + '</b></div>') + '</div>';
      }).join('') + '</div></div>';
    }).join('') + '</div>';
  }
  if (rr.length) {
    var groups = {}; rr.forEach(function (m) { (groups[m.Group || ''] = groups[m.Group || ''] || []).push(m); });
    Object.keys(groups).sort().forEach(function (g) {
      var st = standings(groups[g], E);
      out += (g ? '<h3>Group ' + esc(g) + '</h3>' : '') + '<div class="tablewrap"><table><tr><th>#</th><th>Player / Team</th><th class="num">P</th><th class="num">W</th><th class="num">L</th><th class="num">Games</th></tr>' +
        st.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(r.name) + '</b><br><span class="muted small">' + esc(r.tower) + '</span></td><td class="num">' + r.p + '</td><td class="num">' + r.w + '</td><td class="num">' + r.l + '</td><td class="num">' + r.gf + '–' + r.ga + '</td></tr>'; }).join('') +
        '</table></div><div class="list">' + sortMatches(groups[g]).map(function (m) { return matchRow(m, E, F, cm, true); }).join('') + '</div>';
    });
  }
  if (other.length) out += '<h3>Other matches</h3><div class="list">' + sortMatches(other).map(function (m) { return matchRow(m, E, F, cm, true); }).join('') + '</div>';
  return out;
}
function seedTag(id, E) { var e = id && E[id]; var s = e && (e.seed || (e.raw && e.raw.Seed)); return s ? '<span class="badge pri">' + esc(s) + '</span>' : ''; }
function standings(ms, E) {
  var t = {};
  var add = function (id) { if (id && id !== 'BYE' && !t[id]) t[id] = { id: id, name: E[id] ? E[id].name : id, tower: E[id] ? E[id].tower : '', p: 0, w: 0, l: 0, gf: 0, ga: 0 }; };
  ms.forEach(function (m) {
    add(m.SideA); add(m.SideB);
    if (!m.Winner || m.Result === 'Pending') return;
    var w = m.Winner, l = m.Winner === m.SideA ? m.SideB : m.SideA, g = parseGames(m.Score);
    if (!t[w] || !t[l]) return;
    t[w].p++; t[l].p++; t[w].w++; t[l].l++; t[w].gf += g.w; t[w].ga += g.l; t[l].gf += g.l; t[l].ga += g.w;
  });
  return Object.keys(t).map(function (k) { return t[k]; }).sort(function (a, b) { return b.w - a.w || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf || (a.name < b.name ? -1 : 1); });
}
function catChips(sel, fn, withAll) {
  var cats = D().categories.slice().sort(function (a, b) { return a.Order - b.Order; });

/* ===================== ADMIN ===================== */
function regGroups() {
  var g = {}; S.adm.entries.forEach(function (e) { (g[e.RegID] = g[e.RegID] || []).push(e); }); return g;
}
function capacity() {
  var d = S.adm, p = d.play, cm = catMap();
  var days = String(p.PlayDays || '').split(/\n|;/).map(function (l) { var m = l.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/); return m ? { date: m[1], mins: (+m[4] * 60 + +m[5]) - (+m[2] * 60 + +m[3]) } : null; }).filter(Boolean);
  var avail = days.reduce(function (s, x) { return s + Math.max(0, x.mins); }, 0) * (p.Courts || 1);
  var need = 0, matches = 0;
  // matches already drawn
  var drawn = {}; d.matches.forEach(function (m) { drawn[m.CategoryID] = true; if (m.Result !== 'Bye') { matches++; need += Number(cm[m.CategoryID] && cm[m.CategoryID].SlotMinutes) || p.DefaultSlotMinutes; } });
  // estimate for categories not drawn yet (from current entries)
  var est = 0;
  d.categories.forEach(function (c) {
    if (drawn[c.CategoryID]) return;
    var n = d.entries.filter(function (e) { return e.CategoryID === c.CategoryID && e.Status !== 'Withdrawn'; }).length;
    if (n < 2) return;
    var g = Math.max(1, Math.min(Number(c.Groups) || 1, Math.floor(n / 2)));
    var k = 0;
    if (c.Format === 'Round Robin') { var base = Math.floor(n / g), extra = n % g; for (var i = 0; i < g; i++) { var sz = base + (i < extra ? 1 : 0); k += sz * (sz - 1) / 2; } }
    else k = n - 1;
    est += k; need += k * (Number(c.SlotMinutes) || p.DefaultSlotMinutes);
  });
  return { days: days, avail: avail, need: need, matches: matches, est: est };
}
VIEWS.dash = function () {

  var live = d.entries.filter(function (e) { return e.Status !== 'Withdrawn'; });
  var appr = d.entries.filter(function (e) { return e.PaymentStatus === 'Approved'; });
  var pend = live.filter(function (e) { return e.PaymentStatus === 'Pending'; });
  var fees = appr.reduce(function (s, e) { return s + Number(e.Fee || 0); }, 0);
  var pendAmt = pend.reduce(function (s, e) { return s + Number(e.Fee || 0); }, 0);
  var inc = d.accounts.filter(function (t) { return t.Type === 'Income'; }).reduce(function (s, t) { return s + Number(t.Amount); }, 0);
  var exp = d.accounts.filter(function (t) { return t.Type === 'Expense'; }).reduce(function (s, t) { return s + Number(t.Amount); }, 0);
  var people = {}; live.forEach(function (e) { [e.P1Phone, e.P2Phone].forEach(function (p) { if (p) people[String(p)] = 1; }); if (!e.P2Phone && e.Player2) people[e.Player2.toLowerCase()] = 1; });
  var cap = capacity();
  var pct = cap.avail ? Math.round(cap.need / cap.avail * 100) : 0;
  var stat = function (v, l) { return '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>'; };
  return '<div class="grid" style="margin-bottom:14px">' + stat(Object.keys(regs).length, 'Registrations') + stat(Object.keys(people).length, 'Players') + stat(live.length, 'Entries') +
    stat(pend.length, 'Payments to approve') + stat(money(fees), 'Entry fees received') + stat(money(pendAmt), 'Fees pending') + stat(money(exp), 'Expenses') + stat(money(fees + inc - exp), 'Balance') + '</div>' +
    '<div class="card"><h2>Court time</h2>' +
    '<p class="small">Available: <b>' + Math.round(cap.avail / 60 * 10) / 10 + ' court-hours</b> (' + cap.days.length + ' play day' + (cap.days.length === 1 ? '' : 's') + ' × ' + d.play.Courts + ' court' + (d.play.Courts > 1 ? 's' : '') + ') · Needed: <b>' + Math.round(cap.need / 60 * 10) / 10 + ' hours</b> for ' + (cap.matches + cap.est) + ' matches' + (cap.est ? ' (' + cap.est + ' estimated from entries not yet drawn)' : '') + '</p>' +
    '<div style="height:10px;background:#eef1ed;border-radius:6px;overflow:hidden"><div style="height:10px;width:' + Math.min(100, pct) + '%;background:' + (pct > 100 ? 'var(--bad)' : pct > 85 ? 'var(--warn)' : 'var(--ok)') + '"></div></div>' +
    (pct > 100 ? '<div class="warnbox">You need about ' + pct + '% of the court time you have. Add play days (e.g. weekday evenings for early rounds), shorten match formats or cap entries.</div>' : '<p class="muted small">' + pct + '% of court time used.</p>') + '</div>' +
    '<div class="card"><h2>By category</h2><div class="tablewrap"><table><tr><th>Category</th><th class="num">Entries</th><th class="num">Approved</th><th class="num">Pending</th><th>Draw</th><th class="num">Played</th></tr>' +
    d.categories.slice().sort(function (a, b) { return a.Order - b.Order; }).map(function (c) {
      var es = live.filter(function (e) { return e.CategoryID === c.CategoryID; });
      var ms = d.matches.filter(function (m) { return m.CategoryID === c.CategoryID && m.Result !== 'Bye'; });
      return '<tr><td><b>' + esc(c.Name) + '</b><br><span class="small muted">' + esc(c.Format) + '</span></td><td class="num">' + es.length + (c.MaxEntries ? '/' + c.MaxEntries : '') + '</td><td class="num">' + es.filter(function (e) { return e.PaymentStatus === 'Approved'; }).length + '</td><td class="num">' + es.filter(function (e) { return e.PaymentStatus === 'Pending'; }).length +
        '</td><td>' + (ms.length ? '<span class="badge ok">Made</span>' : '<span class="badge">Not yet</span>') + '</td><td class="num">' + ms.filter(function (m) { return m.Result !== 'Pending'; }).length + '/' + ms.length + '</td></tr>';
    }).join('') + '</table></div></div>';
};
